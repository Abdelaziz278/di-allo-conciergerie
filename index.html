    <style>
        @media print {
            body { background-color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            /* L'application est verrouillée en plein écran : on la libère à l'impression pour imprimer toutes les pages. */
            html, body { position: static !important; overflow: visible !important; height: auto !important; width: auto !important; }
            #root, #root > div, main { height: auto !important; min-height: 0 !important; overflow: visible !important; }
            #root > div { display: block !important; }
            @page { margin: 0; }
            .page-break-inside-avoid { page-break-inside: avoid; break-inside: avoid; }
        }
        .print-only { display: none; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ===================================================== */
        /* OFFRE DE SÉJOUR ILLUSTRÉE — pages A4 (aperçu + PDF)    */
        /* ===================================================== */
        :root {
            --of-bg: #f9f5ef; --of-beige: #f0e7da; --of-paper: #fffcf8; --of-dark: #271c17; --of-dark2: #33251d;
            --of-brown: #795327; --of-gold: #b8975a; --of-line: #e4d8c9; --of-muted: #6f5d50;
        }
        #offer-print-portal { display: none; }
        .offer-page {
            width: 210mm; height: 297mm; background: var(--of-bg); color: var(--of-dark); position: relative; overflow: hidden;
            box-sizing: border-box; font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
            font-size: 8.6pt; line-height: 1.45; text-align: left;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
            break-after: page; page-break-after: always; break-inside: avoid; page-break-inside: avoid;
        }
        .offer-page:last-child { break-after: auto; page-break-after: auto; }
        .offer-page *, .offer-page *::before, .offer-page *::after { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .offer-page p, .offer-page h1, .offer-page h3, .offer-page figure { margin: 0; }
        .of-inner { position: absolute; inset: 0; padding: 13mm 16mm 0 16mm; display: flex; flex-direction: column; }
        .of-content { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
        .of-footer { flex: 0 0 auto; height: 19mm; border-top: 0.3mm solid var(--of-line); display: flex; align-items: center; justify-content: space-between; gap: 4mm;
            font-size: 6.3pt; color: var(--of-muted); letter-spacing: 0.08em; text-transform: uppercase; }
        .of-footer-center { flex: 1; text-align: center; }
        .of-footer-left { min-width: 30mm; display: flex; align-items: center; }
        .of-pageno { min-width: 14mm; text-align: right; font-weight: 700; color: var(--of-dark); letter-spacing: 0.04em; }
        .of-serif, .of-h1, .of-h3, .of-cover-for, .of-slogan { font-family: Georgia, "Times New Roman", "Liberation Serif", serif; }
        .of-kicker { font-size: 6.6pt; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--of-brown); margin-bottom: 4mm; flex: 0 0 auto; }
        .of-h1 { font-size: 22pt; line-height: 1.12; font-weight: 400; color: var(--of-dark); margin-bottom: 1.6mm !important; }
        .of-h3 { font-size: 13pt; font-weight: 400; color: var(--of-dark); margin-bottom: 1.5mm !important; }
        .of-sub { font-weight: 700; font-size: 8.4pt; color: var(--of-dark); }
        .of-loc { font-size: 7.4pt; color: var(--of-muted); margin-top: 1.2mm !important; }
        .of-label { font-size: 7.6pt; font-weight: 700; color: var(--of-brown); margin-bottom: 0.8mm; }
        .of-text { font-size: 8pt; color: var(--of-dark2); white-space: pre-line; }
        .of-small { font-size: 6.9pt; color: var(--of-muted); white-space: pre-line; }
        .of-pricebox { background: var(--of-beige); padding: 2.8mm 4mm; margin: 4mm 0 4mm; flex: 0 0 auto; }
        .of-pricebox-label { font-size: 6.6pt; font-weight: 700; color: var(--of-brown); }
        .of-pricebox-total { font-size: 13pt; font-weight: 700; color: var(--of-dark); margin: 1mm 0 0.5mm; }
        .of-pricebox-total.of-ondemand { font-style: italic; font-weight: 400; font-family: Georgia, "Times New Roman", serif; }
        .of-pricebox-rate { font-size: 6.8pt; color: var(--of-muted); }
        .of-figure { flex: 0 0 auto; }
        .of-photo { position: relative; width: 100%; overflow: hidden; background: #e9e1d5; }
        .of-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .of-photo-empty, .of-photo-missing { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3mm; gap: 1mm; }
        .of-photo-empty { color: var(--of-muted); font-size: 8pt; border: 0.3mm dashed var(--of-gold); background: var(--of-paper); }
        .of-photo-missing { color: #8b2e1e; font-weight: 700; font-size: 8pt; border: 0.4mm dashed #b5523b; background: #fbeee9; }
        .of-photo-missing small { font-weight: 400; font-size: 6.5pt; color: #8b2e1e; }
        .of-photo-loading { color: var(--of-muted); background: var(--of-paper); border-color: var(--of-line); }
        .of-photo-band { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(39,28,23,0.92); color: #fff; font-size: 6.8pt; font-weight: 700; padding: 2mm 3mm; letter-spacing: 0.02em; }
        .of-photo-band .of-illus { color: #e6c88f; }
        .of-caption { font-size: 6.6pt; color: var(--of-muted); margin-top: 1.3mm; }
        .of-illus { color: var(--of-brown); font-weight: 700; }
        .of-grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8mm; row-gap: 3.5mm; border-top: 0.3mm solid var(--of-line); padding-top: 4mm; margin-top: 4mm; flex: 0 0 auto; }
        .of-note { background: var(--of-beige); padding: 3.5mm 5mm; margin-top: 4.5mm; flex: 0 0 auto; }
        .of-note p { font-size: 7.8pt; color: var(--of-dark2); white-space: pre-line; }
        .of-note p + p { margin-top: 2mm; }
        .of-note .of-note-small { font-size: 6.9pt; color: var(--of-muted); }
        .of-link { color: var(--of-brown); font-weight: 700; font-size: 7.4pt; text-decoration: underline; }
        .of-gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm 5mm; margin-top: 3mm; }
        .of-cover-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6mm; margin-top: 5mm; font-size: 7.6pt; color: var(--of-dark2); }
        .of-cover-meta strong { font-size: 10pt; color: var(--of-dark); }
        .of-cover-title { font-size: 30pt !important; margin-top: 2mm; }
        .of-cover-for { font-style: italic; color: var(--of-brown); font-size: 15pt; }
        .of-cover-intro { margin-top: 4mm !important; font-size: 7.8pt; color: var(--of-dark2); }
        .of-availability { font-size: 7pt; font-weight: 700; color: var(--of-brown); margin-top: 1mm !important; }
        .of-cover-photo { flex: 1 1 auto; min-height: 60mm; margin: 5mm 0 4mm; position: relative; display: flex; }
        .of-cover-photo .of-figure { flex: 1 1 auto; display: flex; }
        .of-cover-photo .of-photo { height: auto !important; flex: 1 1 auto; }
.of-flexphoto { flex: 1 1 84mm; min-height: 70mm; max-height: 122mm; display: flex; }
        .of-flexphoto .of-figure { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
        .of-flexphoto .of-photo { flex: 1 1 auto; min-height: 0; }
        .of-flexphoto .of-caption { flex: 0 0 auto; }
        .of-logo-text { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; color: var(--of-dark); font-family: Georgia, "Times New Roman", serif; }
        .of-logo-text span { font-size: 1em; letter-spacing: 0.12em; font-weight: 700; }
        .of-logo-text small { font-size: 0.42em; letter-spacing: 0.25em; color: var(--of-brown); text-transform: uppercase; margin-top: 0.25em; font-family: Helvetica, Arial, sans-serif; }
        .of-table { width: 100%; border-collapse: collapse; margin-top: 5mm; font-size: 7.6pt; }
        .of-table th { background: var(--of-dark); color: #fff; text-align: left; padding: 2.4mm 3mm; font-size: 7pt; font-weight: 700; }
        .of-table td { padding: 2.2mm 3mm; border-bottom: 0.25mm solid var(--of-line); background: var(--of-paper); font-weight: 700; color: var(--of-dark); }
        .of-table .r { text-align: right; white-space: nowrap; }
        .of-table tr.of-group td { background: var(--of-beige); color: var(--of-brown); font-size: 6.4pt; letter-spacing: 0.1em; text-transform: uppercase; padding: 1.6mm 3mm; }
        .of-table .of-ondemand { font-style: italic; font-weight: 400; color: var(--of-muted); }
        .of-row-n { display: inline-block; min-width: 7mm; color: var(--of-gold); font-weight: 700; }
        .of-feebox { background: var(--of-beige); padding: 3.2mm 4.5mm; margin-top: 4.5mm; border-left: 1mm solid var(--of-gold); }
        .of-feebox p { font-size: 7.4pt; color: var(--of-dark2); }
        .of-transfer { display: flex; gap: 5mm; background: var(--of-beige); padding: 3.5mm; margin-top: 4mm; align-items: stretch; }
        .of-transfer-photo { width: 42mm; flex: 0 0 42mm; position: relative; min-height: 26mm; }
        .of-transfer-photo .of-photo { position: absolute; inset: 0; height: auto !important; }
        .of-transfer-price { font-weight: 700; color: var(--of-brown); font-size: 8pt; margin-bottom: 1.4mm; }
        .of-transfer p { font-size: 7.4pt; color: var(--of-dark2); }
        .of-optional { display: inline-block; font-size: 6pt; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--of-paper); background: var(--of-brown); padding: 0.6mm 2mm; margin-bottom: 1.5mm; }
        .of-contact { display: flex; justify-content: space-between; align-items: flex-end; border-top: 0.3mm solid var(--of-line); padding-top: 3mm; margin-top: 4mm; font-size: 7.2pt; color: var(--of-dark2); }
        .of-contact strong { color: var(--of-dark); }
        .of-gold-rule { width: 14mm; height: 0.5mm; background: var(--of-gold); margin: 5mm auto; }
        .of-slogan { text-align: center; font-size: 19pt; line-height: 1.25; color: var(--of-dark); }
        .of-slogan em { font-style: italic; }
        .of-center { text-align: center; }
        /* Pied de page répété sur chaque page des devis et factures imprimés */
        .print-frame { width: 100%; border-collapse: collapse; }
        .print-frame > thead > tr > td, .print-frame > tbody > tr > td, .print-frame > tfoot > tr > td { padding: 0; border: 0; }

        function useSyncedState(docName, initialValue, user) {
            const [state, setState] = useState(initialValue);
            const [isLoaded, setIsLoaded] = useState(false);

            useEffect(() => {
                const local = loadFromStorage('diallo_' + docName, null);
                if (local !== null) {
                    setState(local);
                    setIsLoaded(true);
                }

                if (!user || !window.fbDb) {
                    setIsLoaded(true);
                    return;
                }

                let firstLoad = true;
                const docRef = window.fbDoc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'shared_workspace', docName);
                
                const timeout = setTimeout(() => setIsLoaded(true), 3000); 

                const unsub = window.fbOnSnapshot(docRef, (docSnap) => {
                    clearTimeout(timeout);
                    if (docSnap.exists()) {
                        setState(docSnap.data().value);
                    } else if (firstLoad) {
                        if (local !== null) {
                            window.fbSetDoc(docRef, { value: local });
                        } else {
                            window.fbSetDoc(docRef, { value: initialValue });
                        }
                    }
                    firstLoad = false;
                    setIsLoaded(true);
                }, (err) => {
                    console.error("Erreur de synchro Cloud:", err);
                    clearTimeout(timeout);
                    setIsLoaded(true);
                });

                return () => {
                    clearTimeout(timeout);
                    unsub();
                };
            }, [user, docName]);

            const saveState = (newValue) => {
                setState(newValue);
                const serialized = typeof newValue === 'string' ? newValue : JSON.stringify(newValue);
                try {
                    localStorage.setItem('diallo_' + docName, serialized);
                } catch (e) {
                    // Mémoire locale pleine : on n'interrompt pas l'application, le cloud reste la référence.

                // Firestore limite chaque document à 1 Mo : on prévient avant une perte de synchronisation silencieuse.

        function QuoteBuilderView({ clients, catalog, logoUrl, company, payload, onSave, onCancel, onOpenStayOffer }) {
          const existingQuote = payload ? payload.quote : null;
          const prospectId = payload ? payload.prospectId : null;

          const prospectRef = prospectId ? clients.find(c => c.id == prospectId) : null;
          const pData = prospectRef ? prospectRef.prospectData : null;

          const [currency, setCurrency] = useState(existingQuote && existingQuote.currency ? existingQuote.currency : 'FCFA');
          const [docType, setDocType] = useState(existingQuote && existingQuote.docType ? existingQuote.docType : 'devis');

          const [clientId, setClientId] = useState((existingQuote && existingQuote.clientId) ? existingQuote.clientId : (prospectId || (clients.length > 0 ? clients[0].id : '')));
          const [quoteCity, setQuoteCity] = useState((existingQuote && existingQuote.quoteCity) ? existingQuote.quoteCity : (pData && pData.dest ? pData.dest : 'Casa'));
          const [tripName, setTripName] = useState((existingQuote && existingQuote.tripName) ? existingQuote.tripName : (pData && pData.dest ? ("Séjour CAN " + pData.dest) : 'Séjour VIP Maroc'));
          const [pax, setPax] = useState((existingQuote && existingQuote.pax) ? existingQuote.pax : (pData && pData.pax ? parseInt(pData.pax) : 2));
          
          const [dateIn, setDateIn] = useState((existingQuote && existingQuote.dateIn) ? existingQuote.dateIn : (pData && pData.dateIn ? pData.dateIn : ''));
          const [dateOut, setDateOut] = useState((existingQuote && existingQuote.dateOut) ? existingQuote.dateOut : (pData && pData.dateOut ? pData.dateOut : ''));
          const [globalSeason, setGlobalSeason] = useState((existingQuote && existingQuote.globalSeason) ? existingQuote.globalSeason : 'moyenne');

          const calculatedNights = useMemo(() => {
              if(dateIn && dateOut) {
                  const diff = new Date(dateOut) - new Date(dateIn);
                  return Math.max(1, Math.ceil(diff / (1000 * 60 * 60 * 24)));
              }
              return 1;
          }, [dateIn, dateOut]);
          
          const [accommodations, setAccommodations] = useState((existingQuote && existingQuote.accommodations) ? existingQuote.accommodations : []);
          const [activities, setActivities] = useState((existingQuote && existingQuote.activities) ? existingQuote.activities : []);
          const [transports, setTransports] = useState((existingQuote && existingQuote.transports) ? existingQuote.transports : []);
          const [cars, setCars] = useState((existingQuote && existingQuote.cars) ? existingQuote.cars : []);

          const [isAutoFee, setIsAutoFee] = useState(existingQuote ? existingQuote.isAutoFee : true);
          const [manualFeeMAD, setManualFeeMAD] = useState((existingQuote && existingQuote.manualFeeMAD) ? existingQuote.manualFeeMAD : 0);
          const [feeComment, setFeeComment] = useState((existingQuote && existingQuote.feeComment) ? existingQuote.feeComment : '');
          // Nouveau mode « pourcentage » (devis finaux issus d'une offre illustrée). Les anciens devis restent en Auto / Manuel.
          const [feePercentMode, setFeePercentMode] = useState(!!(existingQuote && existingQuote.feeMode === 'percent'));
          const [feePercent, setFeePercent] = useState((existingQuote && existingQuote.feePercent != null) ? existingQuote.feePercent : 10);
          // Conditions tarifaires propres à ce document (ajout / retrait / masquage)
          const [pricingConditions, setPricingConditions] = useState(() => (existingQuote
              ? normalizeConditions(existingQuote.pricingConditions, legacyQuoteConditions((existingQuote.accommodations || []).length > 0))
              : defaultQuoteConditions(company)));

          const FEE_THRESHOLD_MAD = 40000; 
          const FLAT_FEE_MAD = 4000; 
          const PERCENT_FEE = 0.10;

          const allAvailableCities = useMemo(() => {
              const cities = new Set(["Casa", "Marrakech", "Agadir", "Rabat", "Fès", "Tanger", "Chefchaouen"]);
              if (catalog.accommodations) catalog.accommodations.forEach(a => { if (a.city) cities.add(a.city.trim()); });
              if (catalog.activities) catalog.activities.forEach(a => { if (a.city) cities.add(a.city.trim()); });
              return Array.from(cities).sort();
          }, [catalog]);

          const filteredAccommodations = catalog.accommodations ? catalog.accommodations.filter(a => a.city && a.city.trim().toLowerCase() === quoteCity.trim().toLowerCase()) : [];
          const filteredActivities = catalog.activities ? catalog.activities.filter(a => a.city && a.city.trim().toLowerCase() === quoteCity.trim().toLowerCase()) : [];

          const handleAddAccom = (e) => {
            const item = catalog.accommodations.find(a => a.id == e.target.value);
            if (item) setAccommodations([...accommodations, { ...item, season: globalSeason, nights: calculatedNights, customNote: '' }]);
            e.target.value = '';
          };
          const handleAddActivity = (e) => {
            const item = catalog.activities.find(a => a.id == e.target.value);
            const qty = item.pricingMode === 'pax' ? pax : 1; 
            if (item) setActivities([...activities, { ...item, quantity: qty }]);
            e.target.value = '';
          };
          const handleAddTransport = (e) => {
            const item = catalog.transports.find(a => a.id == e.target.value);
            const qty = item.pricingMode === 'pax' ? pax : 1;
            if (item) setTransports([...transports, { ...item, quantity: qty, dates: defaultTransferDates(item, item.pricingMode === 'pax' ? 1 : qty, dateIn, dateOut) }]);
            e.target.value = '';
          };
          const handleAddCar = (e) => {
            const item = catalog.cars.find(a => a.id == e.target.value);
            if (item) setCars([...cars, { ...item, days: calculatedNights }]);
            e.target.value = '';
          };

          const updateList = (setter, list, index, field, value) => {
            const newList = [...list];
            newList[index][field] = value;
            setter(newList);
          };
          const removeList = (setter, list, index) => {
            const newList = [...list];
            newList.splice(index, 1);
            setter(newList);
          };

          const calcAccomMAD = accommodations.reduce((sum, item) => sum + ((item.prices && item.prices[item.season] ? item.prices[item.season] : 0) * item.nights), 0);
          const calcActMAD = activities.reduce((sum, item) => sum + ((item.price || 0) * item.quantity), 0);
          const calcTransMAD = transports.reduce((sum, item) => sum + ((item.price || 0) * item.quantity), 0);
          const calcCarMAD = cars.reduce((sum, item) => sum + ((item.price || 0) * item.days), 0);
          
          const subTotalMAD = calcAccomMAD + calcActMAD + calcTransMAD + calcCarMAD;
          let calcFeeMAD = 0;
          if (subTotalMAD > 0) calcFeeMAD = subTotalMAD > FEE_THRESHOLD_MAD ? subTotalMAD * PERCENT_FEE : FLAT_FEE_MAD;
          const finalFeeMAD = feePercentMode ? computeFee(subTotalMAD, feePercent) : (isAutoFee ? calcFeeMAD : (parseFloat(manualFeeMAD) || 0));
          const feeModeValue = feePercentMode ? 'percent' : (isAutoFee ? 'auto' : 'manual');
          const changeFeeMode = (mode) => { setFeePercentMode(mode === 'percent'); setIsAutoFee(mode === 'auto'); };
          const feeConditionLines = feePercentMode
              ? [`Honoraires ${normalizeCompany(company).name} : ${feePercent} % du coût total des prestations retenues pour le voyage, transfert compris s'il est réservé. Les honoraires sont facturés séparément.`]
              : isAutoFee
                  ? [`Si coût total ${accommodations.length > 0 ? 'du séjour' : 'des prestations'} > à 4 000 € : une commission de 10 % est prélevée sur le coût total.`, `Si coût total ${accommodations.length > 0 ? 'du séjour' : 'des prestations'} < à 4 000 € : forfait fixe de 400 € appliqué.`]
                  : [`Honoraires ${normalizeCompany(company).name} : ${renderMoney(finalFeeMAD, currency)}${feeComment ? ' (' + feeComment + ')' : ''}.`];
          const serviceSummary = buildServiceSummary({
              accommodations, transports, cars, activities, pax,
              travelersLabel: (existingQuote && existingQuote.travelersLabel && existingQuote.pax === pax) ? existingQuote.travelersLabel : null,
              dateIn, dateOut, nights: accommodations.length > 0 && dateIn && dateOut ? calculatedNights : 0,
              cities: null, proposition: docType === 'proposition',
          });
          const travelersText = (existingQuote && existingQuote.travelersLabel && existingQuote.pax === pax) ? existingQuote.travelersLabel : `${pax} adulte(s)`;
          const totalMAD = subTotalMAD + finalFeeMAD;

          const doSave = () => {
            if(!clientId) { alert("Veuillez sélectionner un client."); return; }
            const q = {
              ...(existingQuote || {}), // conserve les champs complémentaires (offre source, voyageurs…)
              id: (existingQuote && existingQuote.id) ? existingQuote.id : `DEV-${Date.now().toString().slice(-6)}`,
              date: (existingQuote && existingQuote.date) ? existingQuote.date : new Date().toLocaleDateString('fr-FR'),
              clientId: parseInt(clientId),
              docType,
              quoteCity, tripName, pax, currency, dateIn, dateOut, globalSeason,
              accommodations, activities, transports, cars,
              isAutoFee: feePercentMode ? false : isAutoFee, manualFeeMAD: feePercentMode ? finalFeeMAD : manualFeeMAD, feeComment: feePercentMode ? `${feePercent} % du coût total des prestations retenues` : feeComment,
              feeMode: feeModeValue, feePercent, pricingConditions,
              total: totalMAD, subTotal: subTotalMAD, finalFee: finalFeeMAD,
              status: (existingQuote && existingQuote.status) ? existingQuote.status : 'Brouillon'
            };
            onSave(q);
          };

          const uniqueCities = Array.from(new Set([...accommodations.map(a => a.city), ...activities.map(a => a.city)]));
          const displayCities = uniqueCities.length > 0 ? uniqueCities.join(', ') : quoteCity;

          return (
            <div className="max-w-7xl mx-auto pb-20">
              
              {/* === HEADER ACTIONS (No Print) === */}
              <div className="bg-slate-900 rounded-2xl p-4 md:p-6 text-white flex flex-col md:flex-row justify-between items-center shadow-xl mb-8 no-print sticky top-4 z-40">
                <div className="flex items-center gap-3 mb-4 md:mb-0">
                  <div className="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center text-slate-900 text-2xl font-bold">
                    <i className="ph ph-magic-wand"></i>
                  </div>
                  <div>
                    <h2 className="text-xl md:text-2xl font-black">{existingQuote ? 'Modifier le Document' : 'Création de Document'}</h2>
                    <p className="text-slate-400 text-sm">Préparez votre offre client</p>
                  </div>
                </div>
                <div className="flex gap-2 items-center w-full md:w-auto overflow-x-auto">
                  <select value={currency} onChange={(e) => setCurrency(e.target.value)} className="bg-slate-800 text-white p-2 rounded-lg outline-none focus:ring-2 focus:ring-amber-500 mr-1 font-bold text-sm">
                    <option value="MAD">MAD</option>
                    <option value="FCFA">FCFA</option>
                    <option value="EUR">EUR</option>
                  </select>
                  <button onClick={onCancel} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium transition flex-1 md:flex-none whitespace-nowrap">Annuler</button>
                  <button onClick={() => window.print()} className="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition flex items-center justify-center gap-2 flex-1 md:flex-none whitespace-nowrap">
                    <i className="ph ph-printer"></i> PDF
                  </button>
                  <button onClick={() => {
                    const client = clients.find(c => c.id == clientId);
                    const subject = encodeURIComponent("Votre offre de séjour : " + tripName);
                    const body = encodeURIComponent("Bonjour " + (client && client.firstName ? client.firstName : '') + ",\n\nVeuillez trouver ci-joint notre proposition pour votre séjour au Maroc.\n\n(N'oubliez pas de joindre le PDF généré !)\n\nBien cordialement,\nL'équipe DI’ALLO Conciergerie");
                    window.location.href = "mailto:" + (client && client.email ? client.email : '') + "?subject=" + subject + "&body=" + body;
                  }} className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-bold transition flex items-center justify-center gap-2 flex-1 md:flex-none whitespace-nowrap">
                    <i className="ph ph-envelope-simple"></i> Email
                  </button>
                  <button onClick={doSave} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-lg transition flex items-center justify-center gap-2 flex-1 md:flex-none whitespace-nowrap shadow-lg shadow-amber-500/20">
                    <i className="ph ph-floppy-disk"></i> Enregistrer
                  </button>
                </div>
              </div>

              {/* === BUILDER GRID === */}
              <div className="grid grid-cols-1 xl:grid-cols-3 gap-8 no-print">
                
                {/* LEFT COL: EDITOR */}
                <div className="xl:col-span-2 space-y-6">
                  
                  {/* WIDGET PROSPECT (Visible uniquement si création depuis un prospect) */}
                  {pData && !existingQuote && (
                      <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl shadow-sm mb-6">
                          <h3 className="font-bold text-amber-800 flex items-center gap-2 mb-2"><i className="ph ph-lightbulb"></i> Rappel des souhaits du client</h3>
                          <div className="text-sm text-amber-900 grid grid-cols-2 gap-2">
                              <p><strong>Hébergement :</strong> {pData.accom}</p>
                              <p><strong>Budget :</strong> {pData.budget ? `${pData.budget} €` : 'N/C'}</p>
                              <p><strong>Activités :</strong> {pData.acts || 'Non précisé'}</p>
                              <p><strong>Transport/Auto :</strong> {pData.trans} / {pData.car}</p>
                          </div>
                      </div>
                  )}

                  {/* 1. INFOS GENERALES */}
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
                    <h3 className="font-bold text-lg mb-4 flex items-center gap-2 border-b border-slate-100 pb-2">
                      <i className="ph ph-info text-blue-500"></i> Configuration Globale
                    </h3>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Client</label>
                        <select value={clientId} onChange={(e) => setClientId(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg outline-none min-w-[150px]">
                          <option value="">Sélectionner...</option>
                          {clients.map(c => <option key={c.id} value={c.id}>{c.firstName} {c.lastName}</option>)}
                        </select>
                      </div>
                      <div className="md:col-span-2">
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nom du dossier</label>
                        <input type="text" value={tripName} onChange={(e) => setTripName(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg outline-none min-w-[200px]" />
                      </div>
                      <div>
                         <label className="block text-xs font-bold text-purple-600 uppercase mb-1">Type de Document</label>
                         <select value={docType} onChange={(e) => setDocType(e.target.value)} className="w-full p-2.5 bg-purple-50 text-purple-900 font-bold border border-purple-200 rounded-lg outline-none cursor-pointer min-w-[150px]">
                             <option value="devis">Devis Final (Totalisé)</option>
                             <option value="proposition">Proposition (Choix Multiples)</option>
                         </select>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Ville filtre</label>
                        <select value={quoteCity} onChange={(e) => setQuoteCity(e.target.value)} className="w-full p-2 bg-amber-50 text-amber-900 font-bold border border-amber-200 rounded-lg outline-none">
                            {allAvailableCities.map(city => <option key={city} value={city}>{city}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Saison filtre</label>
                        <select value={globalSeason} onChange={(e) => setGlobalSeason(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg outline-none">
                            <option value="basse">Basse</option>
                            <option value="moyenne">Moyenne</option>
                            <option value="haute">Haute</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Arrivée</label>
                        <input type="date" value={dateIn} onChange={(e) => setDateIn(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Départ</label>
                        <input type="date" value={dateOut} onChange={(e) => setDateOut(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Pax</label>
                        <input type="number" min="1" value={pax} onChange={(e) => setPax(parseInt(e.target.value)||1)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-center" />
                      </div>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                      <h3 className="font-bold text-lg mb-3 flex items-center gap-2 border-b border-slate-100 pb-2"><i className="ph ph-text-align-left text-amber-600"></i> Résumé de l’offre <span className="text-xs font-normal text-slate-400">(aperçu client, mis à jour automatiquement)</span></h3>
                      <p className="text-[11px] font-black uppercase tracking-widest text-amber-700 mb-1">{docType === 'proposition' ? 'Proposition' : serviceSummary.title}</p>
                      <p className="text-sm text-slate-600 leading-relaxed bg-slate-50 border-l-4 border-amber-500 rounded-lg p-3">
                          <ServiceSummaryText summary={{ ...serviceSummary, lines: [...serviceSummary.lines, `Lieu(x) d’intervention : **${uniqueCities.length > 0 ? displayCities : quoteCity}**.`] }} />
                      </p>
                  </div>

                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                      <h3 className="font-bold text-lg mb-3 flex items-center gap-2 border-b border-slate-100 pb-2"><i className="ph ph-scroll text-amber-600"></i> Conditions tarifaires</h3>
                      <ConditionsEditor value={pricingConditions} onChange={setPricingConditions} feePreview={feeConditionLines.join(' / ')}
                          onReset={() => { if (window.confirm('Remplacer les conditions de ce document par celles des Paramètres ?')) setPricingConditions(defaultQuoteConditions(company)); }} />
                  </div>

                  {docType === 'proposition' && onOpenStayOffer && (
                      <div className="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-sm flex flex-col md:flex-row md:items-center gap-4">
                          <div className="w-12 h-12 rounded-xl bg-amber-500 text-slate-900 flex items-center justify-center text-2xl shrink-0"><i className="ph ph-images"></i></div>
                          <div className="flex-1">
                              <p className="font-black">Générer une offre de séjour illustrée</p>
                              <p className="text-xs text-slate-300">Reprend le client, la destination, les dates, les hébergements et le transfert aéroport de cette proposition : fiches avec photos, récapitulatif et PDF A4.</p>
                          </div>
                          <button onClick={() => {
                              const airport = transports.find(t => cityKey(t.name).includes('aeroport'));
                              onOpenStayOffer({
                                  clientId, destination: quoteCity, dateIn, dateOut, pax, season: globalSeason,
                                  currency: currency === 'FCFA' ? 'MAD' : currency,
                                  catalogIds: accommodations.map(a => a.id),
                                  transfer: airport ? { price: airport.price, route: airport.name.replace('=>', 'vers') } : null,
                              });
                          }} className="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-xl whitespace-nowrap"><i className="ph ph-arrow-right"></i> Ouvrir le générateur</button>
                      </div>
                  )}

                  {/* 2. HEBERGEMENT */}
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-amber-200/50">
                    <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                      <h3 className="font-bold text-lg flex items-center gap-2 text-amber-600">
                        <i className="ph ph-bed"></i> Hébergements ({quoteCity})
                      </h3>
                    </div>
                    
                    <select onChange={handleAddAccom} value="" className="w-full p-2 border border-slate-200 rounded-lg mb-4 text-sm bg-slate-50 font-medium">
                      <option value="" disabled>+ Ajouter un hébergement à {quoteCity}...</option>
                      {filteredAccommodations.map(a => <option key={a.id} value={a.id}>{a.name} ({a.type})</option>)}
                      {filteredAccommodations.length === 0 && <option disabled>Aucun hébergement trouvé pour {quoteCity}</option>}
                    </select>

                    <div className="space-y-3">
                      {accommodations.map((item, idx) => (
                        <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200 relative">
                          <button onClick={() => removeList(setAccommodations, accommodations, idx)} className="absolute top-4 right-4 text-red-400 hover:text-red-600"><i className="ph ph-trash text-lg"></i></button>
                          
                          <div className="pr-8">
                            <p className="font-bold text-slate-800">{item.city} - {item.name}</p>
                            <input type="text" placeholder="Note (ex: du 01 au 04/01)" value={item.customNote || ''} onChange={(e)=>updateList(setAccommodations, accommodations, idx, 'customNote', e.target.value)} className="w-full text-sm p-1.5 border border-slate-200 rounded mt-2 bg-white" />
                          </div>
                          
                          <div className="flex flex-wrap items-end gap-4 mt-4 bg-white p-3 rounded-lg border border-slate-100">
                            <div className="flex-1 min-w-[120px]">
                              <label className="block text-xs text-slate-500 mb-1">Saison</label>
                              <select value={item.season} onChange={(e)=>updateList(setAccommodations, accommodations, idx, 'season', e.target.value)} className="w-full p-1.5 text-sm border rounded">
                                <option value="basse">Basse ({renderMoney((item.prices && item.prices.basse) ? item.prices.basse : 0, currency)})</option>
                                <option value="moyenne">Moyenne ({renderMoney((item.prices && item.prices.moyenne) ? item.prices.moyenne : 0, currency)})</option>
                                <option value="haute">Haute ({renderMoney((item.prices && item.prices.haute) ? item.prices.haute : 0, currency)})</option>
                              </select>
                            </div>
                            <div className="w-20">
                              <label className="block text-xs text-slate-500 mb-1">Nuits</label>
                              <input type="number" min="1" value={item.nights} onChange={(e) => updateList(setAccommodations, accommodations, idx, 'nights', parseInt(e.target.value)||0)} className="w-full p-1.5 border rounded text-center font-bold" />
                            </div>
                            <div className="w-32 text-right">
                              <label className="block text-xs text-slate-500 mb-1">Total Ligne</label>
                              <p className="font-bold text-slate-800">{renderMoney((item.prices && item.prices[item.season] ? item.prices[item.season] : 0) * item.nights, currency)}</p>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 3. TRANSPORTS */}
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-200/50">
                    <h3 className="font-bold text-lg mb-4 flex items-center gap-2 border-b border-slate-100 pb-2 text-emerald-600">
                      <i className="ph ph-car-profile"></i> Transports & Transferts
                    </h3>
                    <select onChange={handleAddTransport} value="" className="w-full p-2 border border-slate-200 rounded-lg mb-4 text-sm bg-slate-50 font-medium">
                      <option value="" disabled>+ Ajouter un transfert...</option>
                      {catalog.transports && catalog.transports.map(a => <option key={a.id} value={a.id}>[{a.mode}] {a.name}</option>)}
                    </select>

                    <div className="space-y-3">
                      {transports.map((item, idx) => (
                        <div key={idx} className="flex flex-col md:flex-row md:items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200 gap-3">
                          <div className="flex-1">
                            <p className="font-bold text-slate-800 text-sm">{item.name}</p>
                            <p className="text-xs text-emerald-600 mt-1 font-medium bg-emerald-100 inline-block px-2 py-0.5 rounded">{item.mode} • {item.pricingMode === 'pax' ? 'Prix par pers.' : 'Forfait groupe'} ({renderMoney(item.price || 0, currency)})</p>
                            <div className="mt-2 flex flex-wrap items-center gap-2">
                              <span className="text-[10px] font-bold uppercase text-slate-500">{transportTripCount(item) > 1 ? `Dates des ${transportTripCount(item)} trajets` : 'Date du trajet'}</span>
                              {Array.from({ length: Math.min(transportTripCount(item), 12) }, (_, k) => (
                                <input key={k} type="date" value={(item.dates || [])[k] || ''} onChange={(e) => { const d = [...(item.dates || [])]; d[k] = e.target.value; updateList(setTransports, transports, idx, 'dates', d); }} className="p-1 border border-slate-200 rounded text-xs bg-white" />
                              ))}
                            </div>
                          </div>
                          <div className="flex items-center justify-between md:justify-end gap-4 bg-white p-2 rounded-lg border border-slate-100 mt-2 md:mt-0">
                            <div className="text-center">
                              <span className="text-[10px] text-slate-400 block uppercase font-bold">{item.pricingMode==='pax' ? 'Pax' : ((parseInt(item.tripsPerUnit) || 1) > 1 ? 'Allers-retours' : 'Trajets')}</span>
                              <input type="number" min="1" value={item.quantity} onChange={(e) => updateList(setTransports, transports, idx, 'quantity', parseInt(e.target.value)||0)} className="w-12 p-1 border rounded text-center text-sm font-bold" />
                            </div>
                            <div className="w-24 text-right font-bold">{renderMoney((item.price || 0) * item.quantity, currency)}</div>
                            <button onClick={() => removeList(setTransports, transports, idx)} className="text-red-400 p-1"><i className="ph ph-trash text-lg"></i></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 4. CAR RENTAL */}
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-purple-200/50">
                    <h3 className="font-bold text-lg mb-4 flex items-center gap-2 border-b border-slate-100 pb-2 text-purple-600">
                      <i className="ph ph-steering-wheel"></i> Location de Voiture
                    </h3>
                    <select onChange={handleAddCar} value="" className="w-full p-2 border border-slate-200 rounded-lg mb-4 text-sm bg-slate-50 font-medium">
                      <option value="" disabled>+ Louer un véhicule...</option>
                      {catalog.cars && catalog.cars.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                    </select>

                    <div className="space-y-3">
                      {cars.map((item, idx) => (

                                <PrintTable title="Location de Voiture" items={cars} cols={['Modèle', 'Jours', 'Tarif/Jour', 'Total']} rowRender={(item) => (

                                    <td className="p-3 text-right">{renderMoney(item.price || 0, currency)} <span className="text-xs text-slate-400">{item.pricingMode==='pax' ? '/pers' : '/groupe'}</span></td>
                                    <td className="p-3 text-right font-bold text-amber-600">{renderMoney((item.price || 0) * item.quantity, currency)}</td>
                                </>
                                )} />

                        {/* Total et Honoraires */}
                        <div className="flex justify-end mt-12 page-break-inside-avoid">

        function CatalogAdminView({ catalog, setCatalog }) {
          const [editingItem, setEditingItem] = useState(null);

          const handleAdd = (type) => {
              if(type === 'accommodations') {
                  setEditingItem({ type, isNew: true, data: { id: Date.now().toString(), city: 'Casa', name: 'Nouvel Hébergement', type: 'Studio', pricingMode: 'nuit', prices: { basse: 0, moyenne: 0, haute: 0 } } });
              } else if(type === 'activities') {
                  setEditingItem({ type, isNew: true, data: { id: Date.now().toString(), city: 'Casa', name: 'Nouvelle Activité', pricingMode: 'pax', price: 0 } });
              } else if(type === 'transports') {
                  setEditingItem({ type, isNew: true, data: { id: Date.now().toString(), mode: 'Van privé', name: 'Nouveau Trajet', pricingMode: 'group', price: 0 } });
              } else if(type === 'cars') {
                  setEditingItem({ type, isNew: true, data: { id: Date.now().toString(), name: 'Nouveau Véhicule', pricingMode: 'jour', price: 0 } });
              }
          }

          const saveEdit = (type, item) => {
              if (!catalog[type]) {
                  alert("Erreur technique: type de catalogue introuvable.");
                  return;
              }
              
              let processed = { ...item };
              
              if (processed.name) processed.name = processed.name.trim();
              if (processed.city) processed.city = processed.city.trim();
              if (processed.mode) processed.mode = processed.mode.trim();
              
              if (type === 'accommodations') {
                  processed.prices = {
                      basse: Number((item.prices && item.prices.basse) ? item.prices.basse : 0) || 0,
                      moyenne: Number((item.prices && item.prices.moyenne) ? item.prices.moyenne : 0) || 0,
                      haute: Number((item.prices && item.prices.haute) ? item.prices.haute : 0) || 0
                  };
              } else {
                  processed.price = Number(item.price) || 0;
              }

              if (editingItem.isNew) {
                  setCatalog({...catalog, [type]: [processed, ...catalog[type]]});
              } else {
                  const newList = catalog[type].map(a => a.id === item.id ? processed : a);
                  setCatalog({...catalog, [type]: newList});
              }
              setEditingItem(null);
          };

          const deleteItem = (type, id) => {
              if(window.confirm("Êtes-vous sûr de vouloir supprimer cet élément ?")) {
                  const newList = catalog[type].filter(a => a.id !== id);
                  setCatalog({...catalog, [type]: newList});
                  setEditingItem(null);
              }
          }

          return (
             <div className="max-w-7xl mx-auto space-y-6 pb-12">
              <div className="flex justify-between items-end border-b border-slate-200 pb-4">
                <div>
                  <h2 className="text-3xl font-black text-slate-800 tracking-tight">Base de données (Catalogue)</h2>
                  <p className="text-slate-500 mt-1">Consultez tous vos tarifs dans les 3 devises. <strong className="text-slate-700">Cliquez sur "+ Ajouter" pour insérer une ligne manquante.</strong></p>
                </div>
              </div>

              {/* Hébergements Table */}
              <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div className="bg-amber-50 p-4 border-b font-bold text-amber-800 flex justify-between items-center">
                    <span><i className="ph ph-bed"></i> Hébergements</span>
                    <button onClick={() => handleAdd('accommodations')} className="text-xs bg-amber-500 text-slate-900 px-3 py-1 rounded shadow hover:bg-amber-600 transition">+ Ajouter</button>
                </div>
                <div className="overflow-x-auto max-h-[400px]">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-slate-50 sticky top-0 border-b shadow-sm z-10">
                            <tr>
                                <th className="p-3">Ville</th>
                                <th className="p-3">Type</th>
                                <th className="p-3">Désignation</th>
                                <th className="p-3">Fiche offre</th>
                                <th className="p-3 text-right">Basse / Moy. / Haute (MAD)</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {catalog.accommodations && catalog.accommodations.map(a => (
                                <tr key={a.id} onClick={() => setEditingItem({type: 'accommodations', isNew: false, data: a})} className="hover:bg-amber-50 cursor-pointer transition">
                                    <td className="p-3 font-bold">{a.city}</td>
                                    <td className="p-3"><span className={`px-2 py-1 rounded text-xs font-bold ${a.type === 'Villa' ? 'bg-amber-200 text-amber-800' : 'bg-slate-200 text-slate-700'}`}>{a.type}</span></td>
                                    <td className="p-3 font-medium">{a.name}{a.commercialName ? <span className="block text-xs text-slate-400">{a.commercialName}</span> : null}</td>
                                    <td className="p-3 text-xs text-slate-500">{(a.photos || []).length > 0 ? <span className="text-emerald-600 font-bold"><i className="ph ph-camera"></i> {(a.photos || []).length}</span> : <span className="text-slate-300"><i className="ph ph-camera-slash"></i></span>}{a.neighborhood ? ' · ' + a.neighborhood : ''}</td>
                                    <td className="p-3 text-right text-slate-600 font-mono text-xs">{(a.prices && a.prices.basse) ? a.prices.basse : 0} / <span className="font-bold text-slate-800">{(a.prices && a.prices.moyenne) ? a.prices.moyenne : 0}</span> / {(a.prices && a.prices.haute) ? a.prices.haute : 0}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
              </div>

              {/* Destinations : photos de couverture des offres illustrées */}
              <CatalogDestinationsPanel catalog={catalog} setCatalog={setCatalog} />

              {/* Activités Table */}
              <div className="bg-white rounded-2xl shadow-sm border overflow-hidden mt-8">
                <div className="bg-rose-50 p-4 border-b font-bold text-rose-800 flex justify-between items-center">
                    <span><i className="ph ph-ticket"></i> Activités</span>
                    <button onClick={() => handleAdd('activities')} className="text-xs bg-rose-500 text-white px-3 py-1 rounded shadow hover:bg-rose-600 transition">+ Ajouter</button>
                </div>
                <div className="overflow-x-auto max-h-[400px]">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-slate-50 sticky top-0 border-b shadow-sm z-10">
                            <tr>
                                <th className="p-3">Ville</th>
                                <th className="p-3">Désignation</th>
                                <th className="p-3 text-center">Mode de Calcul</th>
                                <th className="p-3 text-right">Tarif (MAD)</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {catalog.activities && catalog.activities.map(a => (
                                <tr key={a.id} onClick={() => setEditingItem({type: 'activities', isNew: false, data: a})} className="hover:bg-rose-50 cursor-pointer transition">
                                    <td className="p-3 font-bold">{a.city}</td>
                                    <td className="p-3 font-medium truncate max-w-[250px]" title={a.name}>{a.name}</td>
                                    <td className="p-3 text-center"><span className="bg-slate-100 px-2 py-1 rounded text-xs">{a.pricingMode === 'pax' ? 'Par pers.' : 'Groupe'}</span></td>
                                    <td className="p-3 text-right font-bold">{renderMoney(a.price || 0, 'MAD')}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                  {/* Voitures Table */}
                  <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <div className="bg-purple-50 p-4 border-b font-bold text-purple-800 flex justify-between items-center">
                        <span><i className="ph ph-steering-wheel"></i> Voitures</span>
                        <button onClick={() => handleAdd('cars')} className="text-xs bg-purple-500 text-white px-3 py-1 rounded shadow hover:bg-purple-600 transition">+ Ajouter</button>
                    </div>
                    <div className="overflow-x-auto max-h-80">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <tbody className="divide-y divide-slate-100">
                                {catalog.cars && catalog.cars.map(a => (
                                    <tr key={a.id} onClick={() => setEditingItem({type: 'cars', isNew: false, data: a})} className="hover:bg-purple-50 cursor-pointer transition">
                                        <td className="p-3 font-bold">{a.name}</td>
                                        <td className="p-3 text-right font-bold text-purple-700">{a.price || 0} MAD/j</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                  </div>

                  {/* Transports Table */}
                  <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <div className="bg-emerald-50 p-4 border-b font-bold text-emerald-800 flex justify-between items-center">
                        <span><i className="ph ph-car-profile"></i> Transports</span>
                        <button onClick={() => handleAdd('transports')} className="text-xs bg-emerald-500 text-white px-3 py-1 rounded shadow hover:bg-emerald-600 transition">+ Ajouter</button>
                    </div>
                    <div className="overflow-x-auto max-h-80">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <tbody className="divide-y divide-slate-100">
                                {catalog.transports && catalog.transports.map(a => (
                                    <tr key={a.id} onClick={() => setEditingItem({type: 'transports', isNew: false, data: a})} className="hover:bg-emerald-50 cursor-pointer transition">
                                        <td className="p-3 font-bold text-emerald-700">{a.mode}</td>
                                        <td className="p-3">{a.name}</td>
                                        <td className="p-3 text-right font-bold">{a.price || 0} MAD</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                  </div>
              </div>

              {/* Modal d'édition/Ajout */}
              {editingItem && (
                <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
                    <div className={`bg-white rounded-2xl shadow-xl w-full ${editingItem.type === 'accommodations' ? 'max-w-3xl' : 'max-w-sm'} overflow-hidden flex flex-col max-h-[90vh]`}>
                        <div className="p-4 bg-slate-900 text-white flex justify-between items-center shrink-0">
                            <h3 className="font-bold text-lg">{editingItem.isNew ? 'Ajouter' : 'Modifier'} l'élément</h3>
                            <button onClick={() => setEditingItem(null)}><i className="ph ph-x text-xl"></i></button>
                        </div>
                        
                        <div className="p-6 space-y-4 overflow-y-auto">

                            {(editingItem.type === 'accommodations' || editingItem.type === 'activities') && (
                                <div><label className="block text-sm font-bold mb-1">Ville</label><input type="text" value={editingItem.data.city || ''} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, city: e.target.value}})} className="w-full p-2 border rounded text-sm" /></div>
                            )}
                            
                            {editingItem.type === 'transports' && (
                                <div><label className="block text-sm font-bold mb-1">Mode (ex: Van privé, TGV, Bus)</label><input type="text" value={editingItem.data.mode || ''} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, mode: e.target.value}})} className="w-full p-2 border rounded text-sm" /></div>
                            )}

                            {editingItem.type === 'accommodations' && (
                                <div>
                                    <label className="block text-sm font-bold mb-1">Type d'hébergement</label>
                                    <select value={editingItem.data.type || 'Studio'} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, type: e.target.value}})} className="w-full p-2 border rounded text-sm font-bold text-amber-700 bg-amber-50">
                                        <option value="Studio">Studio</option>
                                        <option value="Appartement">Appartement</option>
                                        <option value="Villa">Villa Privée (Premium)</option>
                                        <option value="Riad">Riad</option>
                                        <option value="Maison">Maison</option>
                                        <option value="Hôtel">Hôtel</option>
                                        <option value="Appart’hôtel">Appart’hôtel</option>
                                    </select>
                                </div>
                            )}

                            <div><label className="block text-sm font-bold mb-1">Désignation / Nom {editingItem.type === 'accommodations' && <span className="text-xs font-normal text-slate-400">(interne)</span>}</label><input type="text" value={editingItem.data.name || ''} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, name: e.target.value}})} className="w-full p-2 border rounded font-bold" /></div>

                            {editingItem.type === 'accommodations' && (
                                <CatalogAccommodationSheet data={editingItem.data} onChange={(patch) => setEditingItem({...editingItem, data: {...editingItem.data, ...patch}})} />
                            )}
                            
                            {/* PRICING */}
                            <div className="bg-slate-100 p-4 rounded-xl border border-slate-200 mt-4">
                                {editingItem.type === 'accommodations' ? (
                                    <>
                                        <label className="block text-sm font-bold mb-2 text-slate-700">Tarification (MAD) / Nuit</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            <div><label className="block text-xs font-bold mb-1">Basse Saison</label><input type="number" value={(editingItem.data.prices && editingItem.data.prices.basse) ? editingItem.data.prices.basse : 0} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, prices: {...editingItem.data.prices, basse: e.target.value}}})} className="w-full p-2 border rounded font-bold" /></div>
                                            <div><label className="block text-xs font-bold mb-1">Moy. Saison</label><input type="number" value={(editingItem.data.prices && editingItem.data.prices.moyenne) ? editingItem.data.prices.moyenne : 0} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, prices: {...editingItem.data.prices, moyenne: e.target.value}}})} className="w-full p-2 border rounded font-bold" /></div>
                                            <div><label className="block text-xs font-bold mb-1 text-amber-600">Haute Saison</label><input type="number" value={(editingItem.data.prices && editingItem.data.prices.haute) ? editingItem.data.prices.haute : 0} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, prices: {...editingItem.data.prices, haute: e.target.value}}})} className="w-full p-2 border rounded font-bold" /></div>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <div><label className="block text-sm font-bold mb-1 text-slate-700">Prix de base (MAD)</label><input type="number" value={editingItem.data.price || 0} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, price: e.target.value}})} className="w-full p-2 border rounded font-bold text-lg" /></div>
                                        {editingItem.data.pricingMode && editingItem.type !== 'cars' && (
                                            <div className="mt-3">
                                                <label className="block text-sm font-bold mb-1 text-slate-700">Mode de Tarification</label>
                                                <select value={editingItem.data.pricingMode} onChange={e=>setEditingItem({...editingItem, data: {...editingItem.data, pricingMode: e.target.value}})} className="w-full p-2 border rounded text-sm">
                                                    <option value="pax">Par Personne (Pax)</option>
                                                    <option value="group">Forfait Groupe</option>
                                                </select>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>

                        </div>

                        <div className="p-4 bg-slate-50 border-t flex gap-2 shrink-0">
                            {!editingItem.isNew && (
                                <button onClick={() => deleteItem(editingItem.type, editingItem.data.id)} className="bg-white border border-red-200 text-red-600 font-bold py-2 px-4 rounded-xl hover:bg-red-50"><i className="ph ph-trash"></i></button>
                            )}
                            <button onClick={() => saveEdit(editingItem.type, editingItem.data)} className="flex-1 bg-amber-500 text-slate-900 font-bold py-2 rounded-xl hover:bg-amber-600 shadow-md">Sauvegarder les modifications</button>
                        </div>

                    </div>
                </div>
              )}
            </div>

                                    <label key={a.id} className={`flex items-center gap-3 p-3 cursor-pointer hover:bg-amber-50 ${selected.includes(a.id) ? 'bg-amber-50' : ''}`}>
                                        <input type="checkbox" checked={selected.includes(a.id)} onChange={() => toggle(a.id)} className="accent-amber-500 w-4 h-4" />
                                        <div className="flex-1 min-w-0">
                                            <p className="font-bold text-sm truncate">{a.commercialName || a.name} <span className="text-[10px] font-bold uppercase bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded ml-1">{OFFER_KINDS[kind].label}</span></p>
                                            <p className="text-xs text-slate-500 truncate">{a.city}{a.neighborhood ? ' · ' + a.neighborhood : ''} · Interne : {a.name}{a.supplierName ? ' · Fournisseur : ' + a.supplierName : ''}</p>
                                        </div>
                                        <div className="text-right text-xs shrink-0">
                                            <p className="font-mono">{(a.prices && a.prices.basse) || 0} / {(a.prices && a.prices.moyenne) || 0} / {(a.prices && a.prices.haute) || 0}</p>
                                            <p className={photos ? 'text-emerald-600' : 'text-slate-400'}><i className="ph ph-camera"></i> {photos} photo{photos > 1 ? 's' : ''}{existingCatalogIds.includes(a.id) ? ' · déjà ajouté' : ''}</p>
                                        </div>
                                    </label>
                                );
                            })}
                        </div>
                        <div className="p-3 border-t flex justify-end gap-2 bg-slate-50">
                            <button onClick={onClose} className="px-4 py-2 rounded-lg bg-white border font-medium text-sm">Annuler</button>
                            <button disabled={!selected.length} onClick={() => onAdd(selected.map((id) => all.find((a) => a.id === id)).filter(Boolean))} className="px-4 py-2 rounded-lg bg-amber-500 font-bold text-sm disabled:opacity-50">Ajouter {selected.length ? `(${selected.length})` : ''}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function OfferOptionEditor({ option: o, index, groupCount, groupIndex, nights, so, open, onToggle, onChange, onMove, onRemove, onDuplicate, onResetFromCatalog, currency }) {
            const set = (k) => (e) => onChange({ [k]: e.target.value });
            const rate = toNumberOrNull(o.nightlyRate);
            const total = optionTotal(o, nights);
            const catalogRate = o.catalogPrices ? Number(o.catalogPrices[so.season]) || 0 : null;
            return (
                <div className={`rounded-2xl border ${open ? 'border-amber-300 shadow-md' : 'border-slate-200'} bg-white overflow-hidden`}>
                    <div className="flex items-center gap-3 p-3 bg-slate-50 cursor-pointer" onClick={onToggle}>
                        <span className="w-8 h-8 rounded-lg bg-slate-900 text-amber-400 font-black flex items-center justify-center text-sm shrink-0">{pad2(index)}</span>
                        <div className="relative w-14 h-10 rounded overflow-hidden bg-slate-200 of-thumb shrink-0">{o.photos[0] ? <OfferImg src={o.photos[0].src} label={optionTitle(o)} /> : <i className="ph ph-image text-slate-400 absolute inset-0 m-auto w-5 h-5"></i>}</div>
                        <div className="flex-1 min-w-0">
                            <p className="font-bold text-sm truncate">{optionTitle(o)}</p>
                            <p className="text-[11px] text-slate-500 truncate">
                                <span className="font-bold uppercase">{OFFER_KINDS[o.kind].label}</span>
                                {(o.supplierName || o.internalName) && <span> · Interne : {o.supplierName || o.internalName}</span>}
                                {' · '}{o.photos.length} photo{o.photos.length > 1 ? 's' : ''}
                            </p>
                        </div>
                        <div className="text-right shrink-0">
                            <p className="font-black text-sm">{total !== null ? formatOfferAmount(total, currency) : <span className="italic text-slate-400 font-medium">Sur demande</span>}</p>
                            <p className="text-[11px] text-slate-500">{rate !== null ? `${formatOfferAmount(rate, currency)} / nuit` : 'tarif non renseigné'}</p>
                        </div>
                        <div className="flex flex-col shrink-0" onClick={(e) => e.stopPropagation()}>
                            <button title="Monter" disabled={groupIndex === 0} onClick={() => onMove(-1)} className="px-1 text-slate-500 hover:text-slate-900 disabled:opacity-25"><i className="ph ph-caret-up"></i></button>
                            <button title="Descendre" disabled={groupIndex === groupCount - 1} onClick={() => onMove(1)} className="px-1 text-slate-500 hover:text-slate-900 disabled:opacity-25"><i className="ph ph-caret-down"></i></button>
                        </div>
                        <button title="Retirer de l’offre" onClick={(e) => { e.stopPropagation(); if (window.confirm('Retirer cette option de l’offre ?')) onRemove(); }} className="text-red-400 hover:text-red-600 shrink-0"><i className="ph ph-trash text-lg"></i></button>
                    </div>

                    {open && (
                        <div className="p-4 space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                                <OfField label="Catégorie">
                                    <select value={o.kind} onChange={set('kind')} className={ofInput}>
                                        <option value="location">Location privée</option>
                                        <option value="hotel">Hôtel</option>
                                        <option value="apparthotel">Appart’hôtel</option>
                                    </select>
                                </OfField>
                                <OfField label="Type de logement">
                                    <input list="of-accom-types" value={o.type} onChange={set('type')} className={ofInput} />
                                </OfField>
                                <OfField label="Fournisseur (interne)" hint="Jamais imprimé dans le PDF." className="md:col-span-2">
                                    <input value={o.supplierName} onChange={set('supplierName')} placeholder={o.internalName || 'Propriétaire, agence, hôtel…'} className={ofInput + ' bg-purple-50 border-purple-200'} />
                                </OfField>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {o.kind !== 'location' && (
                                    <OfField label="Nom commercial de l’hôtel">
                                        <input value={o.commercialName} onChange={set('commercialName')} placeholder="Ex. ONOMO Casablanca City Center" className={ofInput} />
                                    </OfField>
                                )}
                                <OfField label="Titre dans le PDF" hint={o.publicTitle ? 'Titre personnalisé.' : `Automatique : « ${autoOptionTitle(o)} »`} className={o.kind === 'location' ? 'md:col-span-2' : ''}>
                                    <div className="flex gap-2">
                                        <input value={o.publicTitle} onChange={set('publicTitle')} placeholder={autoOptionTitle(o)} className={ofInput} />
                                        {o.publicTitle && <button type="button" onClick={() => onChange({ publicTitle: '' })} className="text-xs px-2 bg-slate-100 rounded-lg shrink-0" title="Revenir au titre automatique"><i className="ph ph-arrow-counter-clockwise"></i></button>}
                                    </div>
                                </OfField>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                <OfField label="Quartier"><input value={o.neighborhood} onChange={set('neighborhood')} placeholder="Ex. Maârif, L’Oasis" className={ofInput} /></OfField>
                                <OfField label="Ville"><input value={o.city} onChange={set('city')} placeholder={so.destination} className={ofInput} /></OfField>
                                <OfField label="Surface (m²)"><input type="number" min="0" value={o.surface} onChange={set('surface')} className={ofInput} /></OfField>
                                <OfField label="Logement / chambre"><input value={o.unitLabel} onChange={set('unitLabel')} placeholder="Ex. Une chambre séparée" className={ofInput} /></OfField>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <OfField label="Sous-titre (PDF)" hint={o.subtitle ? '' : `Automatique : « ${optionSubtitle(o)} »`}><input value={o.subtitle} onChange={set('subtitle')} placeholder={optionSubtitle(o)} className={ofInput} /></OfField>
                                <OfField label={o.kind === 'location' ? 'Adresse (interne)' : 'Adresse de l’hôtel'} hint={o.kind === 'location' ? 'Pour une location privée, le PDF n’affiche que le quartier.' : ''}><input value={o.address} onChange={set('address')} className={ofInput} /></OfField>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <OfField label="Couchage"><textarea rows={2} value={o.bedding} onChange={set('bedding')} className={ofInput} /></OfField>
                                <OfField label="Équipements"><textarea rows={2} value={o.equipments} onChange={set('equipments')} className={ofInput} /></OfField>
                                <OfField label="Formule et repas"><textarea rows={2} value={o.formula} onChange={set('formula')} placeholder="Ex. Petit-déjeuner inclus" className={ofInput} /></OfField>
                                <OfField label="Services"><textarea rows={2} value={o.services} onChange={set('services')} className={ofInput} /></OfField>
                                <OfField label={o.kind === 'location' ? 'Le quartier' : 'Emplacement'}><textarea rows={2} value={o.neighborhoodText} onChange={set('neighborhoodText')} className={ofInput} /></OfField>
                                <OfField label="Pour vos vacances (point fort)"><textarea rows={2} value={o.highlight} onChange={set('highlight')} className={ofInput} /></OfField>
                                <OfField label="Points à confirmer" className="md:col-span-2"><textarea rows={2} value={o.remark} onChange={set('remark')} placeholder="Ex. Disponibilité et conditions d’accueil pour une adulte et un enfant à confirmer avant réservation." className={ofInput} /></OfField>
                            </div>

                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 grid grid-cols-2 md:grid-cols-4 gap-3 items-end">
                                <OfField label="Tarif par nuit (MAD)" hint={o.rateSource === 'catalog' ? `Repris du catalogue (saison ${SEASON_LABELS[so.season].toLowerCase()})` : 'Tarif ajusté pour cette offre'}>
                                    <input type="number" min="0" value={o.nightlyRate === null ? '' : o.nightlyRate} onChange={(e) => onChange({ nightlyRate: e.target.value === '' ? null : Number(e.target.value), rateSource: 'manual' })} placeholder="Sur demande" className={ofInput + ' font-bold bg-white'} />
                                </OfField>
                                <div>
                                    <p className="text-[11px] font-bold text-slate-500 uppercase mb-1">Total {nightsLabel(nights)}</p>
                                    <p className="font-black text-lg">{total !== null ? formatOfferAmount(total, currency) : <span className="italic text-slate-400 text-sm">Sur demande</span>}</p>
                                </div>
                                <OfField label="Précision tarif"><input value={o.rateNote} onChange={set('rateNote')} placeholder="Ex. petit-déjeuner inclus" className={ofInput + ' bg-white'} /></OfField>
                                <OfField label="Libellé récapitulatif" hint={o.summaryLabel ? '' : `Auto : « ${optionSummaryLabel(o)} »`}><input value={o.summaryLabel} onChange={set('summaryLabel')} placeholder={optionSummaryLabel(o)} className={ofInput + ' bg-white'} /></OfField>
                                {catalogRate !== null && (
                                    <p className="col-span-2 md:col-span-4 text-[11px] text-amber-800">
                                        Catalogue : basse {o.catalogPrices.basse} · moyenne {o.catalogPrices.moyenne} · haute {o.catalogPrices.haute} MAD.
                                        {o.rateSource !== 'catalog' && <button type="button" onClick={() => onChange({ nightlyRate: toNumberOrNull(catalogRate), rateSource: 'catalog' })} className="ml-2 underline font-bold">Reprendre le tarif {SEASON_LABELS[so.season].toLowerCase()} ({catalogRate || 'sur demande'})</button>}
                                    </p>
                                )}
                            </div>

                            <div>
                                <p className="text-[11px] font-bold text-slate-500 uppercase mb-2">Photos — la première est la photo principale, les suivantes forment la galerie</p>
                                <PhotoListEditor photos={o.photos} onChange={(photos) => onChange({ photos })} label={optionTitle(o)} />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <OfField label="Note sous la galerie"><input value={o.galleryNote} onChange={set('galleryNote')} placeholder="Ex. Photos officielles de l’hôtel." className={ofInput} /></OfField>
                                <OfField label="Lien vers le site / la galerie"><input type="url" value={o.websiteUrl} onChange={set('websiteUrl')} placeholder="https://" className={ofInput} /></OfField>
                            </div>

                            <div className="flex flex-wrap gap-2 justify-end pt-2 border-t">
                                {o.catalogId && <button type="button" onClick={onResetFromCatalog} className="text-xs px-3 py-1.5 bg-slate-100 rounded-lg font-bold"><i className="ph ph-arrows-clockwise"></i> Recharger depuis le catalogue</button>}
                                <button type="button" onClick={onDuplicate} className="text-xs px-3 py-1.5 bg-slate-100 rounded-lg font-bold"><i className="ph ph-copy"></i> Dupliquer l’option</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ---------- Générateur d'offre ----------
        function StayOfferBuilderView({ clients, catalog, saveCatalog, logoUrl, company, payload, quotes, onSaveOffer, onGenerateFinal, onDuplicate, onCancel }) {
            const existing = payload && payload.quote && payload.quote.stayOffer ? payload.quote : null;
            const prefill = payload && payload.prefill ? payload.prefill : null;
            const initialClientId = existing ? existing.clientId : ((payload && payload.prospectId) || (prefill && prefill.clientId) || (clients[0] ? clients[0].id : ''));

            const [quoteId] = useState(() => (existing ? existing.id : `DEV-${Date.now().toString().slice(-6)}`));
            const [quoteDate] = useState(() => (existing ? existing.date : new Date().toLocaleDateString('fr-FR')));
            const [status, setStatus] = useState(existing ? existing.status || 'Brouillon' : 'Brouillon');
            const [clientId, setClientId] = useState(initialClientId);
            const [so, setSo] = useState(() => (existing
                ? normalizeStayOffer(deepClone(existing.stayOffer))
                : createDefaultStayOffer({ client: clients.find((c) => c.id == initialClientId), prefill, catalog, company })));
            const [savedOnce, setSavedOnce] = useState(!!existing);
            const [dirty, setDirty] = useState(!existing);
            const [openUid, setOpenUid] = useState(null);
            const [showPicker, setShowPicker] = useState(false);
            const [showPreview, setShowPreview] = useState(false);
            const [toast, setToast] = useState('');

            const client = clients.find((c) => c.id == clientId);
            const nights = nightsBetween(so.dateIn, so.dateOut);
            const currency = so.currency;
            const update = (patch) => { setSo((prev) => ({ ...prev, ...patch })); setDirty(true); };
            const updateTransfer = (patch) => { setSo((prev) => ({ ...prev, transfer: { ...prev.transfer, ...patch } })); setDirty(true); };
            const updateOption = (uid, patch) => { setSo((prev) => ({ ...prev, options: prev.options.map((o) => (o.uid === uid ? { ...o, ...patch } : o)) })); setDirty(true); };
            const flash = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2600); };

            useEffect(() => {
                const handler = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
                window.addEventListener('beforeunload', handler);
                return () => window.removeEventListener('beforeunload', handler);
            }, [dirty]);

            const changeClient = (id) => {
                const c = clients.find((x) => x.id == id);
                const pData = c && c.prospectData;
                setClientId(id);
                update({
                    clientLabel: c ? `${c.firstName || ''} ${c.lastName || ''}`.trim() : '',
                    reference: savedOnce ? so.reference : makeOfferReference(c, so.issuedDate),
                    ...(pData && !so.dateIn && pData.dateIn ? { dateIn: pData.dateIn } : {}),
                    ...(pData && !so.dateOut && pData.dateOut ? { dateOut: pData.dateOut } : {}),
                    ...(pData && !so.destination && pData.dest && cityKey(pData.dest) !== 'maroc' ? { destination: pData.dest } : {}),
                });
            };

            const changeDestination = (value) => {
                const patch = { destination: value };
                const rec = (catalog.destinations || []).find((d) => sameCity(d.name, value));
                if (rec && rec.photo && !so.coverPhoto) patch.coverPhoto = normalizePhoto({ ...rec.photo, id: offerUid() });
                // Tarif du transfert aéroport repris du catalogue s'il n'a pas encore été saisi.
                const airport = findAirportTransfer(catalog, value);
                if (airport && so.transfer.price === null) patch.transfer = { ...so.transfer, price: toNumberOrNull(airport.price) };
                update(patch);
            };

            const changeSeason = (season) => {
                setSo((prev) => ({
                    ...prev, season,
                    options: prev.options.map((o) => (o.rateSource === 'catalog' && o.catalogPrices ? { ...o, nightlyRate: toNumberOrNull(o.catalogPrices[season]) } : o)),
                }));
                setDirty(true);
            };

            const changeChildren = (value) => {
                const n = toCount(value, 0);
                update({ children: n, childrenAges: Array.from({ length: n }, (_, i) => so.childrenAges[i] || '') });
            };

            const addFromCatalog = (items) => {
                const added = items.map((item) => makeOptionFromCatalog(item, { season: so.season, destination: so.destination }));
                update({ options: [...so.options, ...added] });
                setShowPicker(false);
                if (added.length === 1) setOpenUid(added[0].uid);
                flash(`${added.length} hébergement${added.length > 1 ? 's' : ''} ajouté${added.length > 1 ? 's' : ''}.`);
            };
            const addManual = () => {
                const opt = normalizeOfferOption({ uid: offerUid(), source: 'manual', kind: 'location', type: 'Appartement', city: so.destination, snapshotAt: new Date().toISOString() });
                update({ options: [...so.options, opt] });
                setOpenUid(opt.uid);
            };
            const moveOption = (uid, dir) => {
                const opts = [...so.options];
                const i = opts.findIndex((o) => o.uid === uid);
                const g = offerGroup(opts[i].kind);
                let j = i + dir;
                while (j >= 0 && j < opts.length && offerGroup(opts[j].kind) !== g) j += dir;
                if (j < 0 || j >= opts.length) return;
                [opts[i], opts[j]] = [opts[j], opts[i]];
                update({ options: opts });
            };
            const removeOption = (uid) => update({ options: so.options.filter((o) => o.uid !== uid), selection: so.selection && so.selection.optionUid === uid ? null : so.selection });
            const duplicateOption = (uid) => {
                const src = so.options.find((o) => o.uid === uid);
                const copy = normalizeOfferOption({ ...deepClone(src), uid: offerUid(), publicTitle: src.publicTitle ? src.publicTitle + ' (variante)' : '', photos: src.photos.map((p) => ({ ...p, id: offerUid() })) });
                const i = so.options.findIndex((o) => o.uid === uid);
                const opts = [...so.options];
                opts.splice(i + 1, 0, copy);
                update({ options: opts });
                setOpenUid(copy.uid);
            };
            const resetFromCatalog = (uid) => {
                const o = so.options.find((x) => x.uid === uid);
                const item = (catalog.accommodations || []).find((a) => a.id === o.catalogId);
                if (!item) { alert('Cet hébergement n’existe plus dans le catalogue.'); return; }
                if (!window.confirm('Remplacer les informations, photos et tarif de cette option par la fiche actuelle du catalogue ?')) return;
                const fresh = makeOptionFromCatalog(item, { season: so.season, destination: so.destination });
                updateOption(uid, { ...fresh, uid });
            };

            const rememberCoverForDestination = () => {
                if (!so.destination || !so.coverPhoto) return;
                const list = (catalog.destinations || []).filter((d) => !sameCity(d.name, so.destination));
                saveCatalog({ ...catalog, destinations: [{ name: so.destination, photo: deepClone(so.coverPhoto) }, ...list] });
                flash(`Photo mémorisée pour ${so.destination}.`);
            };

            const toClientId = (id) => { const n = parseInt(id, 10); return isNaN(n) || String(n) !== String(id).trim() ? id : n; };

            const buildOfferQuote = (soArg, overrides) => {
                const s = soArg || so;
                return {
                    ...(existing || {}),
                    id: quoteId, date: quoteDate, clientId: toClientId(clientId),
                    docType: 'proposition', offerKind: 'illustree',
                    quoteCity: s.destination, tripName: offerTitle(s), pax: s.adults + s.children,
                    currency: s.currency, dateIn: s.dateIn, dateOut: s.dateOut, globalSeason: s.season,
                    accommodations: s.options.map((o) => optionToLegacyAccommodation(o, s)),
                    activities: [], transports: [], cars: [],
                    isAutoFee: false, manualFeeMAD: 0, feeComment: '', subTotal: 0, finalFee: 0, total: 0,
                    status, stayOffer: deepClone(s), updatedAt: new Date().toISOString(),
                    ...(overrides || {}),
                };
            };

            const saveDraft = () => {
                if (!clientId) { alert('Veuillez sélectionner un client.'); return false; }
                onSaveOffer(buildOfferQuote());
                setSavedOnce(true);
                setDirty(false);
                flash('Offre enregistrée.');
                return true;
            };

            // ----- Choix du client -> devis final -----
            const selection = so.selection || { optionUid: '', transferReserved: false };
            const selectedOption = so.options.find((o) => o.uid === selection.optionUid) || null;
            const setSelection = (patch) => update({ selection: { optionUid: '', transferReserved: false, ...(so.selection || {}), ...patch } });
            const selRate = selectedOption ? toNumberOrNull(selectedOption.nightlyRate) : null;
            const selAccom = selRate !== null && nights > 0 ? selRate * nights : null;
            const selTransfer = selection.transferReserved && so.transfer.enabled ? (toNumberOrNull(so.transfer.price) || 0) : 0;
            const selBase = selAccom !== null ? selAccom + selTransfer : null;
            const selFee = selBase !== null ? computeFee(selBase, so.feePercent) : null;
            const existingFinal = so.selection && so.selection.finalQuoteId ? quotes.find((q) => q.id === so.selection.finalQuoteId) : null;

            const generateFinal = () => {
                if (!clientId) { alert('Veuillez sélectionner un client.'); return; }
                if (!selectedOption) { alert('Sélectionnez l’hébergement retenu par le client.'); return; }
                if (nights <= 0) { alert('Renseignez des dates d’arrivée et de départ valides.'); return; }
                if (selRate === null) { alert('L’hébergement retenu est « sur demande » : saisissez son tarif par nuit avant de générer le devis final.'); setOpenUid(selectedOption.uid); return; }
                if (selection.transferReserved && !toNumberOrNull(so.transfer.price)) { alert('Le transfert réservé n’a pas de tarif : renseignez-le dans le bloc Transfert.'); return; }
                if (existingFinal && !window.confirm(`Un devis final existe déjà (${existingFinal.id}). En générer un nouveau ?`)) return;
                const offerQuote = buildOfferQuote(so);
                const finalQuote = buildFinalQuoteFromOffer({ offerQuote, so, option: selectedOption, transferReserved: !!selection.transferReserved && so.transfer.enabled });
                const newSo = { ...so, selection: { ...selection, transferReserved: !!selection.transferReserved && so.transfer.enabled, finalQuoteId: finalQuote.id, decidedAt: todayISO() } };
                setSo(newSo);
                setDirty(false);
                onGenerateFinal(buildOfferQuote(newSo, { status: 'Validé' }), finalQuote);
            };

            // ----- Contrôles avant export -----
            const warnings = [];
            if (!client) warnings.push('Aucun client sélectionné.');
            if (!so.destination) warnings.push('Destination non renseignée.');
            if (!nights) warnings.push('Dates du séjour manquantes ou incohérentes : le nombre de nuits ne peut pas être calculé.');
            if (!so.options.length) warnings.push('Aucun hébergement dans l’offre.');
            if (!logoUrl) warnings.push('Aucun logo configuré dans Paramètres : le nom DI’ALLO sera affiché en texte.');
            if (!so.coverPhoto) warnings.push('Pas de photo de destination pour la couverture.');
            so.options.forEach((o) => {
                const t = optionTitle(o);
                if (!o.photos.length) warnings.push(`« ${t} » : aucune photo.`);
                if (toNumberOrNull(o.nightlyRate) === null) warnings.push(`« ${t} » : tarif non renseigné, affiché « Sur demande ».`);
                const unvalidated = o.photos.filter((p) => !p.caption || !p.captionValidated).length;
                if (unvalidated) warnings.push(`« ${t} » : ${unvalidated} légende(s) vide(s) ou non validée(s).`);
                const unauthorized = o.photos.filter((p) => !p.authorized).length;
                if (unauthorized) warnings.push(`« ${t} » : ${unauthorized} photo(s) non marquée(s) comme autorisée(s).`);
            });
            if (so.transfer.enabled && !toNumberOrNull(so.transfer.price)) warnings.push('Transfert sans tarif : affiché « Sur demande ».');

            const vm = buildOfferViewModel(so, { client, logoUrl, company });
            const fileName = ['Offre_Sejour', so.destination, vm.clientLabel].filter(Boolean).join('_').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_');
            const locOptions = so.options.filter((o) => offerGroup(o.kind) === 'location');
            const hotelOptions = so.options.filter((o) => offerGroup(o.kind) !== 'location');
            const orderedOptions = [...locOptions, ...hotelOptions];
            const cityList = Array.from(new Set([...(catalog.accommodations || []).map((a) => a.city), ...(catalog.destinations || []).map((d) => d.name), 'Casablanca', 'Marrakech', 'Rabat', 'Agadir', 'Fès', 'Tanger'].filter(Boolean)));

            const renderGroup = (list, title) => list.length > 0 && (
                <div className="space-y-3">
                    <p className="text-[11px] font-black uppercase tracking-widest text-slate-400">{title}</p>
                    {list.map((o, gi) => (
                        <OfferOptionEditor key={o.uid} option={o} index={orderedOptions.indexOf(o) + 1} groupIndex={gi} groupCount={list.length}
                            nights={nights} so={so} currency={currency} open={openUid === o.uid}
                            onToggle={() => setOpenUid(openUid === o.uid ? null : o.uid)}
                            onChange={(patch) => updateOption(o.uid, patch)} onMove={(d) => moveOption(o.uid, d)}
                            onRemove={() => removeOption(o.uid)} onDuplicate={() => duplicateOption(o.uid)} onResetFromCatalog={() => resetFromCatalog(o.uid)} />
                    ))}
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto pb-24">
                    <datalist id="of-accom-types">{ACCOM_TYPES.map((t) => <option key={t} value={t} />)}</datalist>
                    <datalist id="of-cities">{cityList.map((c) => <option key={c} value={c} />)}</datalist>

                    <div className="bg-slate-900 rounded-2xl p-4 md:p-5 text-white flex flex-col lg:flex-row justify-between lg:items-center gap-3 shadow-xl mb-6 no-print sticky top-4 z-40">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center text-slate-900 text-2xl"><i className="ph ph-images"></i></div>
                            <div>
                                <h2 className="text-xl font-black">Offre de séjour illustrée {savedOnce && <span className="text-xs font-bold text-slate-400 ml-1">{quoteId}</span>}</h2>
                                <p className="text-slate-400 text-xs">{dirty ? 'Modifications non enregistrées' : 'Brouillon à jour'} · statut : {status}</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => { if (!dirty || window.confirm('Quitter sans enregistrer les modifications ?')) onCancel(); }} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm">Retour</button>
                            {savedOnce && <button onClick={() => { if (dirty && !window.confirm('Dupliquer la version enregistrée ? Les modifications en cours seront d’abord enregistrées.')) return; const q = buildOfferQuote(); setDirty(false); onDuplicate(q); }} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm flex items-center gap-1"><i className="ph ph-copy"></i> Dupliquer</button>}
                            <button onClick={() => setShowPreview(true)} className="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold flex items-center gap-1"><i className="ph ph-eye"></i> Aperçu & PDF</button>
                            <button onClick={saveDraft} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-lg text-sm flex items-center gap-1 shadow-lg shadow-amber-500/20"><i className="ph ph-floppy-disk"></i> Enregistrer le brouillon</button>
                        </div>
                    </div>

                    {toast && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-4 py-2 rounded-xl shadow-lg z-[80] text-sm font-bold no-print"><i className="ph ph-check-circle"></i> {toast}</div>}

                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-6 no-print">
                        <div className="xl:col-span-2 space-y-6">

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                <h3 className="font-bold text-lg flex items-center gap-2 border-b border-slate-100 pb-2"><i className="ph ph-user-circle text-blue-500"></i> Client et séjour</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    <OfField label="Client">
                                        <select value={clientId} onChange={(e) => changeClient(e.target.value)} className={ofInput}>
                                            <option value="">Sélectionner…</option>
                                            {clients.map((c) => <option key={c.id} value={c.id}>{c.firstName} {c.lastName}</option>)}
                                        </select>
                                    </OfField>
                                    <OfField label="Nom affiché dans le PDF" hint="Ex. Mme Aissata"><input value={so.clientLabel} onChange={(e) => update({ clientLabel: e.target.value })} className={ofInput} /></OfField>
                                    <OfField label="Destination"><input list="of-cities" value={so.destination} onChange={(e) => changeDestination(e.target.value)} placeholder="Ex. Casablanca" className={ofInput + ' font-bold'} /></OfField>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-6 gap-3">
                                    <OfField label="Arrivée" className="col-span-1 md:col-span-2"><input type="date" value={so.dateIn} onChange={(e) => update({ dateIn: e.target.value })} className={ofInput} /></OfField>
                                    <OfField label="Départ" className="col-span-1 md:col-span-2"><input type="date" value={so.dateOut} min={so.dateIn || undefined} onChange={(e) => update({ dateOut: e.target.value })} className={ofInput} /></OfField>
                                    <div className="col-span-2 md:col-span-2 flex items-end">
                                        <div className={`w-full p-2 rounded-lg text-center font-black ${nights ? 'bg-amber-100 text-amber-800' : 'bg-red-50 text-red-600 text-xs'}`}>
                                            {nights ? <><i className="ph ph-moon"></i> {nightsLabel(nights)}</> : 'Dates à compléter'}
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-6 gap-3 items-end">
                                    <OfField label="Adultes"><input type="number" min="0" value={so.adults} onChange={(e) => update({ adults: toCount(e.target.value, 0) })} className={ofInput + ' text-center font-bold'} /></OfField>
                                    <OfField label="Enfants"><input type="number" min="0" value={so.children} onChange={(e) => changeChildren(e.target.value)} className={ofInput + ' text-center font-bold'} /></OfField>
                                    {so.childrenAges.map((age, i) => (
                                        <OfField key={i} label={`Âge enfant ${i + 1}`}><input type="number" min="0" max="17" value={age} placeholder="?" onChange={(e) => update({ childrenAges: so.childrenAges.map((a, k) => (k === i ? e.target.value : a)) })} className={ofInput + ' text-center'} /></OfField>
                                    ))}
                                </div>
                                <p className="text-xs text-slate-500">Voyageurs : <strong>{travelersLabel(so.adults, so.children, so.childrenAges)}</strong> · {formatStayRange(so.dateIn, so.dateOut) || 'dates à préciser'}</p>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                                    <OfField label="Titre de l’offre" className="md:col-span-2"><input value={so.title} onChange={(e) => update({ title: e.target.value })} placeholder={offerTitle({ ...so, title: '' })} className={ofInput} /></OfField>
                                    <OfField label="Saison (tarifs catalogue)">
                                        <select value={so.season} onChange={(e) => changeSeason(e.target.value)} className={ofInput}>
                                            {Object.keys(SEASON_LABELS).map((s) => <option key={s} value={s}>{SEASON_LABELS[s]}</option>)}
                                        </select>
                                    </OfField>
                                    <OfField label="Devise du PDF">
                                        <select value={so.currency} onChange={(e) => update({ currency: e.target.value })} className={ofInput}>
                                            <option value="MAD">DH (MAD)</option><option value="EUR">EUR</option><option value="FCFA">FCFA</option>
                                        </select>
                                    </OfField>
                                </div>
                                <OfField label="Phrase d’introduction (couverture)" hint={so.intro ? '' : `Automatique : « ${offerIntro({ ...so, intro: '' }) || '—'} »`}>
                                    <input value={so.intro} onChange={(e) => update({ intro: e.target.value })} placeholder={offerIntro({ ...so, intro: '' })} className={ofInput} />
                                </OfField>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                <h3 className="font-bold text-lg flex items-center gap-2 border-b border-slate-100 pb-2"><i className="ph ph-image-square text-emerald-600"></i> Photos de destination</h3>
                                <OfField label="Couverture">
                                    <SinglePhotoField photo={so.coverPhoto} onChange={(p) => update({ coverPhoto: p })} label="Photo de couverture" withCredit />
                                </OfField>
                                {so.coverPhoto && so.destination && <button type="button" onClick={rememberCoverForDestination} className="text-xs font-bold text-emerald-700 underline"><i className="ph ph-bookmark-simple"></i> Utiliser cette photo par défaut pour {so.destination}</button>}
                                <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={so.closingSameAsCover} onChange={(e) => update({ closingSameAsCover: e.target.checked })} className="accent-amber-500" /> Réutiliser la photo de couverture sur la page de fin</label>
                                {!so.closingSameAsCover && <OfField label="Page de fin"><SinglePhotoField photo={so.closingPhoto} onChange={(p) => update({ closingPhoto: p })} label="Photo de fin" withCredit /></OfField>}
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-amber-200 space-y-4">
                                <div className="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 pb-2">
                                    <h3 className="font-bold text-lg flex items-center gap-2 text-amber-700"><i className="ph ph-bed"></i> Hébergements au choix ({so.options.length})</h3>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowPicker(true)} className="text-sm bg-amber-500 hover:bg-amber-600 font-bold px-3 py-1.5 rounded-lg"><i className="ph ph-list-checks"></i> Depuis le catalogue</button>
                                        <button onClick={addManual} className="text-sm bg-slate-100 hover:bg-slate-200 font-bold px-3 py-1.5 rounded-lg"><i className="ph ph-plus"></i> Hors catalogue</button>
                                    </div>
                                </div>
                                <p className="text-xs text-slate-500">Chaque option est une copie : vos ajustements (textes, photos, tarif) ne modifient pas la fiche du catalogue. Dans le PDF, les locations privées apparaissent d’abord, puis les hôtels et appart’hôtels.</p>
                                {so.options.length === 0 && <div className="p-8 text-center text-slate-400 border-2 border-dashed rounded-xl text-sm">Ajoutez des hébergements depuis le catalogue ou hors catalogue.</div>}
                                {renderGroup(locOptions, 'Locations privées')}
                                {renderGroup(hotelOptions, 'Hôtels et appart’hôtels')}
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-200 space-y-3">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                    <h3 className="font-bold text-lg flex items-center gap-2 text-emerald-700"><i className="ph ph-van"></i> Transfert aéroport (option)</h3>
                                    <label className="flex items-center gap-2 text-sm font-bold"><input type="checkbox" checked={so.transfer.enabled} onChange={(e) => updateTransfer({ enabled: e.target.checked })} className="accent-emerald-600 w-4 h-4" /> Proposer</label>
                                </div>
                                {so.transfer.enabled && <>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        <OfField label="Tarif (MAD)"><input type="number" min="0" value={so.transfer.price === null ? '' : so.transfer.price} placeholder="Sur demande" onChange={(e) => updateTransfer({ price: toNumberOrNull(e.target.value) })} className={ofInput + ' font-bold'} /></OfField>
                                        <OfField label="Trajet">
                                            <select value={so.transfer.tripType} onChange={(e) => updateTransfer({ tripType: e.target.value })} className={ofInput}>
                                                <option value="aller-simple">Aller simple</option><option value="aller-retour">Aller-retour</option>
                                            </select>
                                        </OfField>
                                        <OfField label="Itinéraire" className="col-span-2"><input value={so.transfer.route} onChange={(e) => updateTransfer({ route: e.target.value })} className={ofInput} /></OfField>
                                    </div>
                                    <OfField label="Description"><textarea rows={2} value={so.transfer.description} onChange={(e) => updateTransfer({ description: e.target.value })} className={ofInput} /></OfField>
                                    <OfField label="Photo du transfert (facultative)"><SinglePhotoField photo={so.transfer.photo} onChange={(p) => updateTransfer({ photo: p })} label="Photo du transfert" /></OfField>
                                </>}
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <h3 className="font-bold text-lg flex items-center gap-2 border-b border-slate-100 pb-2"><i className="ph ph-handshake text-purple-600"></i> Honoraires et mentions</h3>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                                    <OfField label="Honoraires (%)" hint="Appliqués au coût total des prestations retenues, transfert compris s’il est réservé.">
                                        <input type="number" min="0" step="0.5" value={so.feePercent} onChange={(e) => update({ feePercent: e.target.value === '' ? 0 : Number(e.target.value) })} className={ofInput + ' font-bold'} />
                                    </OfField>
                                    <OfField label="Référence" ><input value={so.reference} onChange={(e) => update({ reference: e.target.value })} className={ofInput} /></OfField>
                                    <OfField label="Date de la proposition" className="md:col-span-2"><input type="date" value={so.issuedDate} onChange={(e) => update({ issuedDate: e.target.value })} className={ofInput} /></OfField>
                                </div>
                                <OfField label="Pour confirmer votre réservation"><textarea rows={3} value={so.confirmText} onChange={(e) => update({ confirmText: e.target.value })} className={ofInput} /></OfField>
                                <label className="flex items-center gap-2 text-sm font-bold text-slate-700"><input type="checkbox" checked={so.showFeeNote} onChange={(e) => update({ showFeeNote: e.target.checked })} className="accent-amber-500 w-4 h-4" /> Afficher la note sur les honoraires sous le récapitulatif</label>
                                <div className="pt-2 border-t border-slate-100">
                                    <p className="text-[11px] font-bold text-slate-500 uppercase mb-2">Conditions tarifaires</p>
                                    <ConditionsEditor value={so.conditions} onChange={(conditions) => update({ conditions })} title="Afficher les conditions dans le PDF"
                                        onReset={() => { if (window.confirm('Remplacer les conditions de cette offre par celles des Paramètres ?')) update({ conditions: { show: true, items: [STAY_OFFER_DEFAULTS.conditionsText, ...normalizeCompany(company).pricingConditions].filter((t) => t && String(t).trim()).map((text) => ({ id: condId(), type: 'text', text })) } }); }} />
                                </div>
                            </div>
                        </div>

                        <div className="xl:col-span-1 space-y-6">
                            <div className="bg-slate-900 text-white p-5 rounded-2xl shadow-xl xl:sticky xl:top-32 space-y-5">
                                <div>
                                    <h3 className="text-lg font-black mb-3 flex items-center gap-2 border-b border-slate-700 pb-3"><i className="ph ph-calculator text-amber-500"></i> Bilan interne</h3>
                                    <p className="text-xs text-slate-400 mb-3">{nightsLabel(nights)} · {travelersLabel(so.adults, so.children, so.childrenAges)}. Options alternatives : aucun total global.</p>
                                    <div className="space-y-1.5 text-sm max-h-56 overflow-y-auto pr-1">
                                        {orderedOptions.map((o, i) => {
                                            const t = optionTotal(o, nights);
                                            return <div key={o.uid} className="flex justify-between gap-2"><span className="text-slate-300 truncate">{pad2(i + 1)} · {optionTitle(o)}</span><span className="font-bold shrink-0">{t !== null ? formatOfferAmount(t, currency) : <em className="text-slate-500 font-normal">Sur demande</em>}</span></div>;
                                        })}
                                        {so.transfer.enabled && <div className="flex justify-between gap-2 border-t border-slate-700 pt-1.5"><span className="text-emerald-300">Transfert ({TRIP_TYPES[so.transfer.tripType]})</span><span className="font-bold">{so.transfer.price ? formatOfferAmount(so.transfer.price, currency) : <em className="text-slate-500 font-normal">Sur demande</em>}</span></div>}
                                    </div>
                                </div>

                                <div className="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
                                    <h4 className="font-bold flex items-center gap-2"><i className="ph ph-hand-pointing text-amber-500"></i> Choix du client</h4>
                                    <select value={selection.optionUid || ''} onChange={(e) => setSelection({ optionUid: e.target.value })} className="w-full p-2 bg-slate-900 border border-slate-600 rounded-lg text-sm">
                                        <option value="">Hébergement retenu…</option>
                                        {orderedOptions.map((o, i) => <option key={o.uid} value={o.uid}>{pad2(i + 1)} · {optionTitle(o)}</option>)}
                                    </select>
                                    <label className={`flex items-center gap-2 text-sm ${so.transfer.enabled ? '' : 'opacity-40'}`}><input type="checkbox" disabled={!so.transfer.enabled} checked={!!selection.transferReserved && so.transfer.enabled} onChange={(e) => setSelection({ transferReserved: e.target.checked })} className="accent-amber-500" /> Transfert réservé</label>
                                    {selectedOption && (
                                        <div className="text-sm space-y-1 bg-slate-900/60 rounded-lg p-3">
                                            <div className="flex justify-between"><span className="text-slate-400">Hébergement</span><span>{selAccom !== null ? formatOfferAmount(selAccom, currency) : 'Tarif manquant'}</span></div>
                                            <div className="flex justify-between"><span className="text-slate-400">Transfert</span><span>{formatOfferAmount(selTransfer, currency)}</span></div>
                                            <div className="flex justify-between border-t border-slate-700 pt-1"><span className="text-slate-400">Base honoraires</span><span className="font-bold">{selBase !== null ? formatOfferAmount(selBase, currency) : '—'}</span></div>
                                            <div className="flex justify-between text-amber-400"><span>Honoraires {so.feePercent} %</span><span className="font-bold">{selFee !== null ? formatOfferAmount(selFee, currency) : '—'}</span></div>
                                            <div className="flex justify-between text-lg font-black border-t border-slate-700 pt-1"><span>Total devis</span><span>{selBase !== null ? formatOfferAmount(selBase + selFee, currency) : '—'}</span></div>
                                        </div>
                                    )}
                                    <button onClick={generateFinal} className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-black py-2.5 rounded-xl flex items-center justify-center gap-2"><i className="ph ph-file-arrow-down"></i> Générer le devis final</button>
                                    {existingFinal && <p className="text-xs text-slate-400">Devis final existant : <strong className="text-white">{existingFinal.id}</strong> ({existingFinal.status}).</p>}
                                    <p className="text-[11px] text-slate-500 leading-snug">Le devis final reprend le flux habituel : validez-le dans « Devis & Propositions » pour créer la commande, puis la facture.</p>
                                </div>

                                <div>
                                    <h4 className="font-bold text-sm mb-2 flex items-center gap-2"><i className="ph ph-list-checks text-amber-500"></i> Contrôles avant export ({warnings.length})</h4>
                                    {warnings.length === 0 ? <p className="text-xs text-emerald-400">Tout est prêt.</p> : (
                                        <ul className="text-xs text-slate-300 space-y-1 max-h-48 overflow-y-auto list-disc pl-4">{warnings.map((w, i) => <li key={i}>{w}</li>)}</ul>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {showPicker && <CatalogAccomPicker catalog={catalog} destination={so.destination} existingCatalogIds={so.options.map((o) => o.catalogId).filter(Boolean)} onAdd={addFromCatalog} onClose={() => setShowPicker(false)} />}
                    {showPreview && <StayOfferPreviewModal vm={vm} fileName={fileName} warnings={warnings} onClose={() => setShowPreview(false)} />}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>

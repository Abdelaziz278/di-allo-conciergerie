        function SettingsView({ logoUrl, logoBroken, saveLogoUrl, company, saveCompany, catalog, saveCatalog, clients, saveClients, quotes, saveQuotes, orders, saveOrders, requests, saveRequests }) {
            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        saveLogoUrl(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleExportCSV = () => {
                const data = {
                    catalog: JSON.stringify(catalog),
                    clients: JSON.stringify(clients),
                    quotes: JSON.stringify(quotes),
                    orders: JSON.stringify(orders),
                    requests: JSON.stringify(requests),
                    logo: logoUrl
                };
                
                let csv = "Cle,ValeurJSON\n";
                for (let key in data) {
                    if (data[key]) {
                        // Remplacement sécurisé des guillemets pour éviter la casse du CSV
                        let val = data[key].replace(/"/g, '""');
                        csv += `${key},"${val}"\n`;
                    }
                }
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `diallo_sauvegarde_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        let success = false;
                        
                        // 1. Tenter de lire comme un ancien fichier JSON (au cas où l'utilisateur se trompe)
                        if(text.trim().startsWith('{') || text.trim().startsWith('[')) {
                            const parsed = JSON.parse(text);
                            if(parsed.catalog || parsed.clients) {
                                if (parsed.catalog) saveCatalog(typeof parsed.catalog === 'string' ? JSON.parse(parsed.catalog) : parsed.catalog);
                                if (parsed.clients) saveClients(typeof parsed.clients === 'string' ? JSON.parse(parsed.clients) : parsed.clients);
                                if (parsed.quotes) saveQuotes(typeof parsed.quotes === 'string' ? JSON.parse(parsed.quotes) : parsed.quotes);
                                if (parsed.orders) saveOrders(typeof parsed.orders === 'string' ? JSON.parse(parsed.orders) : parsed.orders);
                                if (parsed.requests) saveRequests(typeof parsed.requests === 'string' ? JSON.parse(parsed.requests) : parsed.requests);
                                if (parsed.logo) saveLogoUrl(parsed.logo);
                                alert('Ancienne sauvegarde JSON restaurée avec succès ! L\'application va redémarrer.');
                                window.location.reload();
                                return;
                            }
                        }

                        // 2. Traitement CSV ultra robuste (même si ouvert avec Excel)
                        // On utilise une regex qui capture proprement le contenu entre guillemets même avec des sauts de ligne
                        const regex = /([^,\n\r]+),"([\s\S]*?)"(?=\r?\n[^,\n\r]+,"|$)/g;
                        let match;
                        
                        while ((match = regex.exec(text)) !== null) {
                            const key = match[1].trim();
                            const val = match[2].replace(/""/g, '"'); // Restauration des guillemets d'origine
                            
                            if (key === 'catalog') { saveCatalog(JSON.parse(val)); success = true; }
                            if (key === 'clients') { saveClients(JSON.parse(val)); success = true; }
                            if (key === 'quotes') { saveQuotes(JSON.parse(val)); success = true; }
                            if (key === 'orders') { saveOrders(JSON.parse(val)); success = true; }
                            if (key === 'requests') { saveRequests(JSON.parse(val)); success = true; }
                            if (key === 'logo') { saveLogoUrl(val); success = true; }
                        }
                        
                        if(success) {
                            alert('Sauvegarde CSV restaurée avec succès ! L\'application va redémarrer.');
                            window.location.reload();
                        } else {
                            throw new Error("Aucune donnée valide trouvée dans le CSV");
                        }
                    } catch (err) {
                        console.error(err);
                        alert('Erreur lors de la lecture du fichier. Assurez-vous que c\'est bien le fichier téléchargé d\'origine sans l\'avoir modifié manuellement.');
                    }
                };
                reader.readAsText(file);
            };

            const handleReset = () => {
                if(window.confirm("ATTENTION : Cela va effacer toutes vos données (Clients, Devis, Commandes, Factures) et remettre le catalogue à zéro partout. Êtes-vous sûr ?")) {
                    saveCatalog(initialCatalog);
                    saveClients(initialClients);
                    saveQuotes([]);
                    saveOrders([]);
                    saveRequests([]);
                    saveLogoUrl('');
                    localStorage.clear();
                    window.location.reload();
                }
            };

            return (
              <div className="max-w-4xl mx-auto space-y-6 pb-20">
                <div className="flex justify-between items-end border-b border-slate-200 pb-4">
                  <div>
                    <h2 className="text-3xl font-black text-slate-800 tracking-tight">Paramètres</h2>
                    <p className="text-slate-500 mt-1">Gérez l'identité visuelle et les sauvegardes de votre application.</p>
                  </div>
                </div>
                
                {/* Logo Section */}
                <div className="bg-white p-8 rounded-2xl shadow border border-slate-100 max-w-2xl">
                    <h3 className="font-bold text-lg mb-4 text-slate-800 flex items-center gap-2"><i className="ph ph-image"></i> Identité visuelle</h3>
                    <label className="block text-sm font-bold mb-2">URL du Logo ou Fichier Local</label>
                    <div className="flex gap-2 mb-4">
                        <input type="text" value={logoUrl} onChange={e=>saveLogoUrl(e.target.value)} placeholder="Entrez le nom ou lien vers votre logo" className="flex-1 p-3 border border-slate-200 rounded-lg bg-slate-50 outline-none focus:border-amber-500" />
                        <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 text-white px-4 py-3 rounded-lg font-bold transition flex items-center gap-2 shrink-0">
                            <i className="ph ph-upload-simple text-xl"></i> Importer
                            <input type="file" accept="image/*" className="hidden" onChange={handleLogoUpload} />
                        </label>
                    </div>
                    {logoBroken && <p className="text-sm text-red-600 font-bold mb-3"><i className="ph ph-warning"></i> Ce lien ne fonctionne plus : le logo DI’ALLO intégré est utilisé à la place.</p>}
                    <div className="p-4 border rounded-xl bg-slate-50 flex justify-center items-center min-h-[150px]">
                        <img src={(logoUrl && !logoBroken) ? logoUrl : window.BRAND_LOGO} alt="Prévisualisation" className="w-96 h-auto max-h-64 object-contain" />
                    </div>
                    <div className="mt-3 flex flex-wrap items-center justify-between gap-2">
                        <p className="text-xs text-slate-500">{(logoUrl && !logoBroken) ? 'Logo personnalisé utilisé sur les devis, factures et offres.' : 'Logo DI’ALLO intégré utilisé sur les devis, factures et offres.'}</p>
                        {logoUrl && <button onClick={() => saveLogoUrl('')} className="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-lg hover:bg-amber-100">Revenir au logo DI’ALLO intégré</button>}
                    </div>
                    <div className="mt-4 p-4 rounded-xl bg-slate-950 flex justify-center">
                        <img src={window.BRAND_LOGO_DARK} alt="Version pour fond noir" className="w-64 h-auto object-contain" />
                    </div>
                    <p className="text-xs text-slate-500 mt-1 text-center">Version pour fond noir (menu de l’application).</p>
                </div>

                {/* Coordonnées, pied de page et conditions par défaut */}
                <CompanySettingsCard company={company} saveCompany={saveCompany} />

                {/* Import/Export Section */}
                <div className="bg-white p-8 rounded-2xl shadow border border-slate-100 max-w-2xl mt-6">
                    <h3 className="font-bold text-lg mb-2 text-slate-800 flex items-center gap-2"><i className="ph ph-hard-drives"></i> Sauvegarde & Cloud</h3>
                    <p className="text-sm font-bold text-emerald-600 mb-2">✓ Vos données sont actuellement synchronisées via le Cloud.</p>
                    <p className="text-sm text-slate-600 mb-6">Vous pouvez également télécharger une copie de sécurité locale au format CSV sur votre ordinateur, ou la restaurer en cas de besoin.</p>
                    
                    <div className="flex flex-col sm:flex-row gap-4">
                        <button onClick={handleExportCSV} className="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 shadow">
                            <i className="ph ph-download-simple text-xl text-amber-500"></i> Sauvegarder en CSV
                        </button>
                        
                        <label className="flex-1 cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 border border-slate-300 shadow-sm text-center">
                            <i className="ph ph-upload-simple text-xl text-blue-500"></i> Restaurer (CSV)
                            <input type="file" accept=".csv,.json" className="hidden" onChange={handleImportCSV} />
                        </label>
                    </div>
                </div>

                {/* Danger Zone */}
                <div className="bg-red-50 p-8 rounded-2xl border border-red-200 max-w-2xl mt-6">
                    <h3 className="font-bold text-red-600 mb-2 flex items-center gap-2"><i className="ph ph-warning-circle"></i> Zone de Danger</h3>
                    <p className="text-sm text-slate-600 mb-4">La réinitialisation supprimera définitivement tous vos clients, devis, commandes et remettra le catalogue à zéro partout. Assurez-vous d'avoir fait une sauvegarde avant.</p>
                    <button onClick={handleReset} className="bg-white border-2 border-red-300 hover:bg-red-100 text-red-600 font-bold py-2 px-6 rounded-lg transition-colors w-full sm:w-auto">
                        Réinitialiser l'application
                    </button>
                </div>

              </div>
            );
        }

        // ==========================================
        // 6. OFFRES DE SÉJOUR ILLUSTRÉES
        // ==========================================
        // Une offre illustrée est enregistrée dans « quotes » comme une Proposition (docType 'proposition')
        // avec offerKind 'illustree' et un instantané complet dans quote.stayOffer.
        // Les hébergements sont des choix alternatifs : seul l'option retenue passe dans le devis final.

        const OFFER_KINDS = {
            location: { label: 'Location courte durée', kicker: 'Location courte durée' },
            hotel: { label: 'Hôtel', kicker: 'Hôtel' },
            apparthotel: { label: 'Appart’hôtel', kicker: 'Appart’hôtel' },
        };
        const ACCOM_TYPES = ['Studio', 'Appartement', 'Villa', 'Riad', 'Maison', 'Hôtel', 'Appart’hôtel'];
        const SEASON_LABELS = { basse: 'Basse', moyenne: 'Moyenne', haute: 'Haute' };
        const MONTHS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
        const NUMBER_WORDS_FR = ['Zéro', 'Un', 'Deux', 'Trois', 'Quatre', 'Cinq', 'Six', 'Sept', 'Huit', 'Neuf', 'Dix', 'Onze', 'Douze'];
        const TRIP_TYPES = { 'aller-simple': 'aller simple', 'aller-retour': 'aller-retour' };

        const offerUid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const pad2 = (n) => String(n).padStart(2, '0');
        const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
        const deepClone = (v) => JSON.parse(JSON.stringify(v === undefined ? null : v));

        const parseISODate = (s) => {
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
            return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
        };
        // Nombre de nuits calculé en UTC pour éviter les décalages d'heure d'été.
        const nightsBetween = (a, b) => {
            const A = parseISODate(a), B = parseISODate(b);
            if (!A || !B) return 0;
            const diff = (Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000;
            return diff > 0 ? Math.round(diff) : 0;
        };
        const dayFR = (d) => (d === 1 ? '1er' : String(d));
        const formatLongDateFR = (iso) => { const A = parseISODate(iso); return A ? `${dayFR(A.d)} ${MONTHS_FR[A.m - 1]} ${A.y}` : ''; };
        const formatShortDateFR = (iso) => { const A = parseISODate(iso); return A ? `${pad2(A.d)}/${pad2(A.m)}/${A.y}` : ''; };
        const formatStayRange = (a, b) => {
            const A = parseISODate(a), B = parseISODate(b);
            if (!A || !B) return '';
            if (A.y === B.y && A.m === B.m) return `Du ${dayFR(A.d)} au ${dayFR(B.d)} ${MONTHS_FR[B.m - 1]} ${B.y}`;
            if (A.y === B.y) return `Du ${dayFR(A.d)} ${MONTHS_FR[A.m - 1]} au ${dayFR(B.d)} ${MONTHS_FR[B.m - 1]} ${B.y}`;
            return `Du ${formatLongDateFR(a)} au ${formatLongDateFR(b)}`;
        };
        const nightsLabel = (n) => (n > 0 ? `${n} nuit${n > 1 ? 's' : ''}` : 'Durée à préciser');

        const stripAccents = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
        const cityKey = (s) => stripAccents(s).toLowerCase().replace(/[^a-z0-9]/g, '');
        const sameCity = (a, b) => {
            const A = cityKey(a), B = cityKey(b);
            if (!A || !B) return false;
            if (A === B) return true;
            return (A.length >= 3 && B.startsWith(A)) || (B.length >= 3 && A.startsWith(B)); // « Casa » = « Casablanca »
        };
        // Montant saisi -> nombre > 0, sinon null (« Sur demande »).
        const toNumberOrNull = (v) => {
            if (v === '' || v === null || v === undefined) return null;
            const n = Number(String(v).replace(/\s/g, '').replace(',', '.'));
            return isFinite(n) && n > 0 ? n : null;
        };
        const toCount = (v, min) => { const n = parseInt(v, 10); return isNaN(n) ? min : Math.max(min, n); };

        const formatOfferAmount = (amountMAD, currency) => {
            const cur = currency || 'MAD';
            const val = (Number(amountMAD) || 0) * (EXCHANGE_RATES[cur] || 1);
            const txt = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: cur === 'EUR' ? 2 : 0 }).format(val);
            return txt + ' ' + (cur === 'MAD' ? 'DH' : cur === 'EUR' ? '€' : cur);
        };
        // Honoraires : arrondi au centime, calcul en entiers pour éviter les erreurs de virgule flottante.
        const computeFee = (base, percent) => Math.round((Number(base) || 0) * (Number(percent) || 0)) / 100;

        const kindFromType = (type) => {
            const t = cityKey(type);
            if (t.startsWith('apparthotel') || t.includes('residencehoteliere')) return 'apparthotel';
            if (t.startsWith('hotel')) return 'hotel';
            return 'location';
        };
        const offerGroup = (kind) => (kind === 'location' ? 'location' : 'hotel');
        const sortOfferOptions = (options) => [
            ...(options || []).filter((o) => offerGroup(o.kind) === 'location'),
            ...(options || []).filter((o) => offerGroup(o.kind) !== 'location'),
        ];

        // Préposition devant un quartier : « au Maârif », « à l’Oasis », « à la Corniche ».
        const quartierPrep = (name) => {
            const n = String(name || '').trim();
            if (!n) return '';
            let m;
            if ((m = /^les\s+(.*)$/i.exec(n))) return 'aux ' + m[1];
            if ((m = /^le\s+(.*)$/i.exec(n))) return 'au ' + m[1];
            if ((m = /^la\s+(.*)$/i.exec(n))) return 'à la ' + m[1];
            if ((m = /^l['’]\s*(.*)$/i.exec(n))) return 'à l’' + m[1];
            if (/^[aeiouyhâàäéèêëîïôöûùüAEIOUYHÂÀÄÉÈÊËÎÏÔÖÛÙÜ]/.test(n)) return 'à ' + n;
            return 'au ' + n;
        };
        const cityPrep = (name) => (name ? 'à ' + String(name).trim() : '');
        const bareQuartier = (n) => String(n || '').trim().replace(/^(l['’]\s*|le\s+|la\s+|les\s+)/i, '');

        const genericLocationLabel = (o) => {
            const type = o.type && kindFromType(o.type) === 'location' ? o.type : 'Logement';
            const surface = toNumberOrNull(o.surface) ? ` de ${String(o.surface).trim()} m²` : '';
            const place = o.neighborhood ? quartierPrep(o.neighborhood) : cityPrep(o.city);
            return `${type}${surface}${place ? ' ' + place : ''}`;
        };
        // Nom imprimé : nom commercial pour les hôtels, libellé générique pour les locations privées.
        const autoOptionTitle = (o) => (o.kind === 'location'
            ? ((o.genericLabel || '').trim() || genericLocationLabel(o))
            : ((o.commercialName || '').trim() || (o.internalName || '').trim() || OFFER_KINDS[o.kind].label));
        const optionTitle = (o) => (o.publicTitle || '').trim() || autoOptionTitle(o);
        const optionSubtitle = (o) => {
            if ((o.subtitle || '').trim()) return o.subtitle.trim();
            const first = (o.unitLabel || '').trim() || (o.kind === 'location' ? `${o.type || 'Logement'} en location courte durée` : OFFER_KINDS[o.kind].label);
            const surface = toNumberOrNull(o.surface) ? `${String(o.surface).trim()} m²` : '';
            return [first, surface].filter(Boolean).join(' · ');
        };
        const optionLocationLine = (o, dest) => {
            if ((o.locationLine || '').trim()) return o.locationLine.trim();
            const city = o.city || dest || '';
            if (o.kind !== 'location' && (o.address || '').trim()) {
                const addr = o.address.trim();
                return city && !cityKey(addr).includes(cityKey(city)) ? `${addr}, ${city}` : addr;
            }
            return [o.neighborhood ? `Quartier ${bareQuartier(o.neighborhood)}` : '', city].filter(Boolean).join(', ');
        };
        const optionSummaryLabel = (o) => (o.summaryLabel || '').trim()
            || (o.kind === 'location' ? optionTitle(o) : [(o.commercialName || '').trim() || optionTitle(o), (o.formula || '').trim()].filter(Boolean).join(' · '));
        const optionInfoItems = (o) => [
            ['Couchage', o.bedding],
            ['Équipements', o.equipments],
            ['Formule et repas', o.formula],
            ['Services', o.services],
            [o.kind === 'location' ? 'Le quartier' : 'Emplacement', o.neighborhoodText],
        ].filter(([, v]) => v && String(v).trim()).slice(0, 6);
        const optionTotal = (o, nights) => { const r = toNumberOrNull(o.nightlyRate); return r !== null && nights > 0 ? r * nights : null; };

        const travelersLabel = (adults, children, ages) => {
            const a = toCount(adults, 0), c = toCount(children, 0);
            const parts = [];
            if (a > 0) parts.push(`${a} adulte${a > 1 ? 's' : ''}`);
            if (c > 0) {
                const known = (ages || []).slice(0, c).map((x) => String(x || '').trim()).filter(Boolean);
                let txt = `${c} enfant${c > 1 ? 's' : ''}`;
                if (known.length) txt += ` (${known.length > 1 ? known.slice(0, -1).join(', ') + ' et ' + known[known.length - 1] : known[0]} ans)`;
                parts.push(txt);
            }
            return parts.join(' et ') || 'Voyageurs à préciser';
        };
        const offerTitle = (so) => (so.title || '').trim() || (so.destination ? `Vacances ${cityPrep(so.destination)}` : 'Votre séjour au Maroc');
        const offerIntro = (so) => {
            if ((so.intro || '').trim()) return so.intro.trim();
            const n = (so.options || []).length;
            if (!n) return '';
            const word = NUMBER_WORDS_FR[n] || String(n);
            return `${word} hébergement${n > 1 ? 's' : ''} au choix${so.transfer && so.transfer.enabled ? ' et un transfert privé en option' : ''}.`;
        };
        const makeOfferReference = (client, iso) => {
            const A = parseISODate(iso) || parseISODate(todayISO());
            const base = cityKey((client && (client.lastName || client.firstName)) || 'CLI').toUpperCase().replace(/[0-9]/g, '');
            return `DAC-${String(A.y).slice(-2)}${pad2(A.m)}${pad2(A.d)}-${(base + 'XXX').slice(0, 3)}`;
        };

        const DEFAULT_TRANSFER = {
            enabled: true, price: null, tripType: 'aller-simple',
            route: 'Aéroport vers votre hébergement',
            description: 'Accueil à l’arrivée, prise en charge des bagages et trajet en van privé. Siège enfant sur demande selon l’âge.',
            photo: null,
        };
        const STAY_OFFER_DEFAULTS = {
            version: 1, destination: '', title: '', clientLabel: '', dateIn: '', dateOut: '',
            adults: 2, children: 0, childrenAges: [], season: 'moyenne', currency: 'MAD', intro: '',
            coverPhoto: null, closingPhoto: null, closingSameAsCover: true,
            options: [], transfer: DEFAULT_TRANSFER, feePercent: 10,
            confirmText: 'Indiquez-nous votre hébergement préféré et, le cas échéant, l’âge des enfants. Nous vérifierons la disponibilité, le couchage, les tarifs applicables et les conditions d’annulation avant de vous proposer la réservation.',
            conditionsText: 'Tarifs sous réserve de disponibilité et de confirmation pour les dates du séjour. La réservation est effective après validation et règlement de l’acompte demandé.',
            issuedDate: '', reference: '', selection: null,
            showFeeNote: true, conditions: null,
        };
        const OPTION_DEFAULTS = {
            uid: '', source: 'manual', catalogId: null, kind: 'location', type: 'Appartement',
            internalName: '', supplierName: '', supplierContact: '', commercialName: '', genericLabel: '', publicTitle: '',
            unitLabel: '', subtitle: '', neighborhood: '', address: '', city: '', locationLine: '', surface: '',
            bedding: '', equipments: '', formula: '', services: '', neighborhoodText: '', highlight: '', remark: '',
            nightlyRate: null, rateSource: 'manual', catalogPrices: null, rateNote: '', summaryLabel: '',
            photos: [], galleryNote: '', websiteUrl: '', snapshotAt: '',
        };

        const normalizePhoto = (p) => (p && p.src ? {
            id: p.id || offerUid(), src: String(p.src), caption: p.caption || '', credit: p.credit || '',
            illustrative: !!p.illustrative, captionValidated: !!p.captionValidated, authorized: !!p.authorized,
        } : null);
        const normalizeOfferOption = (o) => {
            const opt = { ...OPTION_DEFAULTS, ...(o || {}) };
            opt.uid = opt.uid || offerUid();
            opt.kind = OFFER_KINDS[opt.kind] ? opt.kind : kindFromType(opt.type);
            opt.photos = (Array.isArray(opt.photos) ? opt.photos : []).map(normalizePhoto).filter(Boolean);
            opt.nightlyRate = toNumberOrNull(opt.nightlyRate);
            return opt;
        };
        // Complète une offre (ancienne ou nouvelle) avec des valeurs par défaut compatibles.
        const normalizeStayOffer = (raw) => {
            const so = { ...STAY_OFFER_DEFAULTS, ...(raw || {}) };
            so.transfer = { ...DEFAULT_TRANSFER, ...((raw && raw.transfer) || {}) };
            so.transfer.price = toNumberOrNull(so.transfer.price);
            so.transfer.photo = normalizePhoto(so.transfer.photo);
            so.coverPhoto = normalizePhoto(so.coverPhoto);
            so.closingPhoto = normalizePhoto(so.closingPhoto);
            so.options = (Array.isArray(so.options) ? so.options : []).map(normalizeOfferOption);
            so.adults = toCount(so.adults, 0);
            so.children = toCount(so.children, 0);
            so.childrenAges = Array.from({ length: so.children }, (_, i) => (Array.isArray(so.childrenAges) && so.childrenAges[i] != null ? String(so.childrenAges[i]) : ''));
            so.feePercent = so.feePercent === '' || so.feePercent === null || isNaN(Number(so.feePercent)) ? 10 : Number(so.feePercent);
            if (!SEASON_LABELS[so.season]) so.season = 'moyenne';
            if (!EXCHANGE_RATES[so.currency]) so.currency = 'MAD';
            so.showFeeNote = so.showFeeNote !== false;
            // Anciennes offres : le texte « conditions » devient la première ligne de la liste.
            so.conditions = normalizeConditions(so.conditions, { show: true, items: (so.conditionsText || '').trim() ? [{ id: condId(), type: 'text', text: so.conditionsText }] : [] });
            so.conditions.items = so.conditions.items.filter((i) => i.type === 'text');
            return so;
        };

        const makeOptionFromCatalog = (item, { season, destination }) => {
            const prices = item.prices || {};
            return normalizeOfferOption({
                uid: offerUid(), source: 'catalog', catalogId: item.id,
                kind: OFFER_KINDS[item.category] ? item.category : kindFromType(item.type), type: item.type || '',
                internalName: item.name || '', supplierName: item.supplierName || '', supplierContact: item.supplierContact || '',
                commercialName: item.commercialName || '', genericLabel: item.genericLabel || '', unitLabel: item.unitLabel || '',
                neighborhood: item.neighborhood || '', address: item.address || '',
                city: destination && sameCity(item.city, destination) ? destination : (item.city || destination || ''),
                surface: item.surface || '', bedding: item.bedding || '', equipments: item.equipments || '', formula: item.formula || '',
                services: item.services || '', neighborhoodText: item.neighborhoodText || '', highlight: item.highlight || '', remark: item.remark || '',
                nightlyRate: toNumberOrNull(prices[season]), rateSource: 'catalog',
                catalogPrices: { basse: Number(prices.basse) || 0, moyenne: Number(prices.moyenne) || 0, haute: Number(prices.haute) || 0 },
                photos: (item.photos || []).map((p) => ({ ...p, id: offerUid() })),

        const findAirportTransfer = (catalog, destination) => {
            const list = (catalog && catalog.transports) || [];
            const airport = list.filter((t) => cityKey(t.name).startsWith('aeroport'));

        const createDefaultStayOffer = ({ client, prefill, catalog, company }) => {
            const p = prefill || {};

            const destination = p.destination || (pData && pData.dest && cityKey(pData.dest) !== 'maroc' ? pData.dest : '') || '';
            const pax = toCount(p.pax || (pData && pData.pax) || 2, 1);
            const airport = findAirportTransfer(catalog, destination);
            const wantsTransfer = pData && pData.trans ? String(pData.trans).startsWith('Oui') : true;
            const issuedDate = todayISO();
            const so = normalizeStayOffer({
                destination,
                clientLabel: client ? `${client.firstName || ''} ${client.lastName || ''}`.trim() : '',
                dateIn: p.dateIn || (pData && pData.dateIn) || '',
                dateOut: p.dateOut || (pData && pData.dateOut) || '',
                adults: p.adults != null ? p.adults : pax, children: p.children || 0, childrenAges: p.childrenAges || [],
                season: p.season || 'moyenne', currency: p.currency || 'MAD',

            so.conditions = { show: true, items: [STAY_OFFER_DEFAULTS.conditionsText, ...normalizeCompany(company).pricingConditions]

                .filter(Boolean)
                .map((item) => makeOptionFromCatalog(item, { season: so.season, destination: so.destination }));
            const destRecord = ((catalog && catalog.destinations) || []).find((d) => sameCity(d.name, destination));
            if (destRecord && destRecord.photo) so.coverPhoto = normalizePhoto({ ...destRecord.photo, id: offerUid() });

        // Convertit une option de l'offre au format « hébergement » des devis existants.

            };
        };

        // Devis final : seul l'hébergement retenu (+ transfert s'il est réservé) entre dans le total.
        const buildFinalQuoteFromOffer = ({ offerQuote, so, option, transferReserved }) => {
            const nights = nightsBetween(so.dateIn, so.dateOut);

        // ---------- Coordonnées société, pied de page et conditions tarifaires ----------
        const DEFAULT_COMPANY = {

        const normalizeCompany = (c) => {

        const joinFr = (arr) => (arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' et ' + arr[arr.length - 1]);
        // Date proposée par défaut pour un transfert du catalogue : arrivée si « Aéroport => … », départ si « … => Aéroport ».

        function buildServiceSummary({ accommodations = [], transports = [], cars = [], activities = [], pax = 1, travelersLabel, dateIn, dateOut, nights, cities, invoice, proposition }) {
            const has = { acc: accommodations.length > 0, tr: transports.length > 0, car: cars.length > 0, act: activities.length > 0 };
            const kinds = Object.values(has).filter(Boolean).length;
            const who = travelersLabel || `${pax} personne${pax > 1 ? 's' : ''}`;
            const tripTotal = transports.reduce((s, t) => s + transportTripCount(t), 0);
            const period = dateIn && dateOut ? `du **${formatShortDateFR(dateIn)}** au **${formatShortDateFR(dateOut)}**` : '';

            else if (kinds === 1 && has.car) { nature = 'location de véhicule'; invoiceNature = 'de votre location de véhicule'; title = 'Location de Véhicule'; }
            else if (kinds === 1 && has.act) { nature = 'activités'; invoiceNature = 'de vos activités'; title = 'Offre d’Activités'; }
            const de = /^[aeiouyhéè]/i.test(nature) ? 'd’' : 'de ';

            const lines = [];

                ? `Facturation ${invoiceNature} pour **${who}**.`

            if (has.acc) {

                    if (missing > 0) txt += dated.length ? ` (+ ${missing} trajet${missing > 1 ? 's' : ''}, date à préciser)` : (n > 1 ? ` (${n} trajets, dates à préciser)` : ' (date à préciser)');
                    if (t.pricingMode === 'pax' && t.quantity) txt += `, ${t.quantity} pers.`;
                    return txt;
                });

                lines.push(kinds === 1 ? `${head} : ${segs.join(' ; ')}.` : `Transferts : ${head} — ${segs.join(' ; ')}.`);

                lines.push(`Location de véhicule : ${segs.join(' ; ')}${!has.acc && period ? ` (${period})` : ''}.`);

            if (has.act) {
                const segs = activities.map((a) => `${a.name}${a.pricingMode === 'pax' ? ` (${a.quantity || 0} pers.)` : ''}`);
                lines.push(`Activité${activities.length > 1 ? 's' : ''} : ${segs.join(', ')}.`);
                if (!has.acc && !has.car && period) lines.push(`Période : ${period}.`);
            }

            if (cities) lines.push(`Lieu(x) d’intervention : **${cities}**.`);
            return { title, lines };
        }

        function ServiceSummaryText({ summary }) {

        function ConditionsEditor({ value, onChange, feePreview, onReset, title, hint, hideToggle }) {

        // ---------- Stockage des photos importées ----------
        // Les photos importées ne sont PAS stockées dans le catalogue ni dans les devis (limite Firestore de 1 Mo
        // par document) : chacune a son propre document « shared_photos », référencé par « fsphoto:<id> ».
        const PhotoStore = (() => {
            const mem = {};
            const pending = {};
            const docRef = (id) => window.fbDoc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'shared_photos', id);
            const isRef = (src) => typeof src === 'string' && src.startsWith('fsphoto:');
            const cloudReady = () => !!(window.fbDb && window.fbDoc && window.fbAuth && window.fbAuth.currentUser);
            const put = async (dataUrl) => {
                const id = 'ph' + offerUid();
                mem[id] = dataUrl;
                let cloud = false;
                if (cloudReady()) {
                    try { await window.fbSetDoc(docRef(id), { data: dataUrl, createdAt: Date.now() }); cloud = true; }
                    catch (e) { console.error('Photo non synchronisée', e); }
                }
                if (!cloud) { try { localStorage.setItem('diallo_photo_' + id, dataUrl); } catch (e) { console.error(e); } }
                return { ref: 'fsphoto:' + id, cloud };
            };
            const get = async (ref) => {
                const id = ref.slice('fsphoto:'.length);
                if (mem[id]) return mem[id];
                try { const local = localStorage.getItem('diallo_photo_' + id); if (local) { mem[id] = local; return local; } } catch (e) { /* ignore */ }
                if (!pending[id]) {
                    pending[id] = (async () => {
                        const start = Date.now();
                        while (!(cloudReady() && window.fbGetDoc) && Date.now() - start < 8000) await new Promise((r) => setTimeout(r, 250));
                        if (!(cloudReady() && window.fbGetDoc)) throw new Error('Cloud indisponible');
                        const snap = await window.fbGetDoc(docRef(id));
                        if (!snap.exists()) throw new Error('Photo introuvable');
                        mem[id] = snap.data().data;
                        return mem[id];
                    })().finally(() => { setTimeout(() => { delete pending[id]; }, 0); });
                }
                return pending[id];
            };
            return { isRef, put, get, peek: (ref) => (isRef(ref) ? mem[ref.slice('fsphoto:'.length)] : ref) };
        })();

        function useResolvedPhotoSrc(src) {
            const initial = () => {
                if (!src) return { src: '', status: 'empty' };
                if (!PhotoStore.isRef(src)) return { src, status: 'ok' };
                const cached = PhotoStore.peek(src);
                return cached ? { src: cached, status: 'ok' } : { src: '', status: 'loading' };
            };
            const [state, setState] = useState(initial);
            useEffect(() => {
                let alive = true;
                const next = initial();
                setState(next);
                if (next.status === 'loading') {
                    PhotoStore.get(src)
                        .then((data) => { if (alive) setState({ src: data, status: 'ok' }); })
                        .catch(() => { if (alive) setState({ src: '', status: 'error' }); });
                }
                return () => { alive = false; };
            }, [src]);
            return state;
        }

        const compressImageFile = (file, maxDim = 1600) => new Promise((resolve, reject) => {
            if (!file || !/^image\//.test(file.type)) { reject(new Error('Le fichier choisi n’est pas une image.')); return; }
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('Lecture du fichier impossible.'));
            reader.onload = () => {
                const img = new Image();
                img.onerror = () => reject(new Error('Image illisible.'));
                img.onload = () => {
                    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    let q = 0.82;
                    let out = canvas.toDataURL('image/jpeg', q);
                    while (out.length > 850000 && q > 0.4) { q -= 0.08; out = canvas.toDataURL('image/jpeg', q); }
                    resolve(out);
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        // Attend le chargement de toutes les images d'un conteneur et liste celles qui sont indisponibles.
        const waitForOfferImages = async (root, timeoutMs = 20000) => {
            const labelOf = (el) => el.getAttribute('data-label') || 'Photo';
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
                const loading = root.querySelectorAll('[data-img-status="loading"]').length;
                const incomplete = Array.from(root.querySelectorAll('img[data-offer-img]')).filter((i) => !i.complete).length;
                if (!loading && !incomplete) break;
                await new Promise((r) => setTimeout(r, 200));
            }
            await new Promise((r) => setTimeout(r, 60)); // laisse React afficher les éventuels remplacements « indisponible »
            const imgs = Array.from(root.querySelectorAll('img[data-offer-img]'));
            await Promise.all(imgs.filter((i) => i.complete && i.naturalWidth > 0 && i.decode).map((i) => i.decode().catch(() => null)));
            const uniq = (arr) => Array.from(new Set(arr));
            return {
                broken: uniq([...Array.from(root.querySelectorAll('[data-img-status="error"]')).map(labelOf), ...imgs.filter((i) => i.complete && i.naturalWidth === 0).map(labelOf)]),
                pending: uniq([...Array.from(root.querySelectorAll('[data-img-status="loading"]')).map(labelOf), ...imgs.filter((i) => !i.complete).map(labelOf)]),
            };
        };

        // ---------- Rendu des pages A4 ----------
        function OfferImg({ src, label, className }) {
            const resolved = useResolvedPhotoSrc(src);
            const [failed, setFailed] = useState(false);
            useEffect(() => { setFailed(false); }, [resolved.src]);
            if (resolved.status === 'loading') {
                return <div className="of-photo-missing of-photo-loading" data-img-status="loading" data-label={label}>Chargement de la photo…</div>;
            }
            if (resolved.status !== 'ok' || failed || !resolved.src) {
                return <div className="of-photo-missing" data-img-status="error" data-label={label}><span>Image indisponible</span><small>{label}</small></div>;
            }
            return <img src={resolved.src} alt={label} data-offer-img="1" data-label={label} className={className} onError={() => setFailed(true)} />;
        }

        function OfferLogo({ logoUrl, height }) {
            const [failed, setFailed] = useState(false);
            if (logoUrl && !failed) {
                return <img src={logoUrl} alt="DI’ALLO Conciergerie" style={{ height, width: 'auto', maxWidth: '70mm', objectFit: 'contain', display: 'block' }} onError={() => setFailed(true)} />;
            }
            return <div className="of-logo-text" style={{ fontSize: `calc(${height} * 0.55)` }}><span>DI’ALLO</span><small>Conciergerie</small></div>;
        }

        const PhotoCaption = ({ photo }) => (photo && (photo.caption || photo.illustrative)
            ? <>{photo.caption}{photo.illustrative && <span className="of-illus">{photo.caption ? ' · ' : ''}Visuel illustratif</span>}</>
            : null);

        function OfferPhoto({ photo, label, height, overlayCaption, showCaption = true }) {
            const hasCaption = photo && (photo.caption || photo.illustrative);
            return (
                <figure className="of-figure">
                    <div className="of-photo" style={{ height }}>
                        {photo && photo.src
                            ? <OfferImg src={photo.src} label={label + (photo.caption ? ' – ' + photo.caption : '')} />
                            : <div className="of-photo-empty">Photo à ajouter</div>}
                        {overlayCaption && hasCaption && <div className="of-photo-band"><PhotoCaption photo={photo} /></div>}
                    </div>
                    {!overlayCaption && showCaption && hasCaption && <figcaption className="of-caption"><PhotoCaption photo={photo} /></figcaption>}
                </figure>
            );
        }

        function buildOfferViewModel(so, { client, logoUrl, company }) {
            const nights = nightsBetween(so.dateIn, so.dateOut);
            const currency = so.currency || 'MAD';
            const money = (v) => formatOfferAmount(v, currency);
            const dest = (so.destination || '').trim();
            const clientLabel = (so.clientLabel || '').trim() || (client ? `${client.firstName || ''} ${client.lastName || ''}`.trim() : '');
            const ordered = sortOfferOptions(so.options);
            const options = ordered.map((o, i) => {
                const rate = toNumberOrNull(o.nightlyRate);
                const total = optionTotal(o, nights);
                const anyIllustrative = o.photos.some((p) => p.illustrative);
                return {
                    ...o, n: i + 1, count: ordered.length,
                    title: optionTitle(o), subtitle: optionSubtitle(o), locationLine: optionLocationLine(o, dest), summaryLabel: optionSummaryLabel(o),
                    rate, total,
                    totalText: total !== null ? money(total) : 'Sur demande',
                    rateText: rate !== null ? `${money(rate)} par nuit${o.rateNote ? ' · ' + o.rateNote : ''}.` : `Tarif sur demande${o.rateNote ? ' · ' + o.rateNote : ''}.`,
                    infoItems: optionInfoItems(o), mainPhoto: o.photos[0] || null, gallery: o.photos.slice(1),
                    galleryText: (o.galleryNote || '').trim() || (anyIllustrative ? 'Les photos marquées « Visuel illustratif » montrent un autre logement ou un espace commun de la résidence.' : ''),
                };
            });
            const pages = [{ type: 'cover' }];
            options.forEach((o) => {
                pages.push({ type: 'detail', option: o });
                for (let i = 0; i < o.gallery.length; i += 5) pages.push({ type: 'gallery', option: o, photos: o.gallery.slice(i, i + 5), part: i / 5, last: i + 5 >= o.gallery.length });
            });
            const hasLoc = options.some((o) => offerGroup(o.kind) === 'location');
            const hasHotel = options.some((o) => offerGroup(o.kind) !== 'location');
            const recapRows = options.length + (hasLoc ? 1 : 0) + (hasHotel ? 1 : 0);
            if (recapRows > 8) { pages.push({ type: 'recap', part: 'table' }); pages.push({ type: 'recap', part: 'details' }); }
            else pages.push({ type: 'recap', part: 'all' });
            pages.push({ type: 'closing' });
            return {
                so, nights, currency, money, dest, clientLabel, options, pages, totalPages: pages.length, logoUrl, company: normalizeCompany(company),
                title: offerTitle(so), intro: offerIntro(so), travelers: travelersLabel(so.adults, so.children, so.childrenAges),
                stayRange: formatStayRange(so.dateIn, so.dateOut), issued: formatLongDateFR(so.issuedDate || todayISO()), reference: so.reference,
                cover: so.coverPhoto, closing: so.closingSameAsCover ? so.coverPhoto : so.closingPhoto,
                footerLabel: `Offre de séjour${clientLabel ? ' · ' + clientLabel : ''}`,
            };
        }

        function OfferPageShell({ vm, index, kicker, footer, children }) {
            const pageNo = `${pad2(index + 1)} / ${pad2(vm.totalPages)}`;
            return (
                <section className="offer-page" data-page={index + 1}>
                    <div className="of-inner">
                        {kicker && <div className="of-kicker">{kicker}</div>}
                        <div className="of-content">{children}</div>
                        <div className="of-footer">
                            <span className="of-footer-left">
                                {footer === 'cover' && <span className="of-footer-left-text">Proposition du {vm.issued}{vm.reference ? <><br />Réf. {vm.reference}</> : null}</span>}
                                {footer === 'standard' && <OfferLogo logoUrl={vm.logoUrl} height="6.5mm" />}
                                {footer === 'closing' && <span className="of-footer-left-text">{vm.company.website}</span>}
                            </span>
                            <div className="of-footer-center of-footer-company">
                                {vm.company.name && <div><strong>{vm.company.name}</strong>{vm.company.phones ? ` · Tél. ${vm.company.phones}` : ''}{vm.company.email ? ` · ${vm.company.email}` : ''}</div>}
                                {(vm.company.ice || vm.company.rib) && <div>{[vm.company.ice && `ICE ${vm.company.ice}`, vm.company.bank, vm.company.rib && `RIB ${vm.company.rib}`].filter(Boolean).join(' · ')}</div>}
                                {sloganText(vm.company.slogan) && <div className="of-footer-slogan">« {sloganText(vm.company.slogan)} »</div>}
                            </div>
                            <span className="of-footer-right">
                                {footer === 'standard' && <span className="of-footer-label">{vm.footerLabel}</span>}
                                <span className="of-pageno">{pageNo}</span>
                            </span>
                        </div>
                    </div>
                </section>
            );
        }

        function OfferCoverPage({ vm, index }) {
            return (
                <OfferPageShell vm={vm} index={index} footer="cover">
                    <div style={{ flex: '0 0 auto' }}><OfferLogo logoUrl={vm.logoUrl} height="19mm" /></div>
                    <div className="of-kicker" style={{ marginTop: '9mm', marginBottom: '3mm' }}>Offre de séjour</div>
                    <h1 className="of-h1 of-cover-title">{vm.title}</h1>
                    {vm.clientLabel && <p className="of-cover-for">Pour {vm.clientLabel}</p>}
                    <div className="of-cover-meta">
                        <strong>{vm.stayRange || 'Dates à préciser'}</strong>
                        <span>{nightsLabel(vm.nights)} · {vm.travelers}</span>
                    </div>
                    {vm.intro && <p className="of-cover-intro">{vm.intro}</p>}
                    <p className="of-availability">Offre sous réserve de disponibilité.</p>
                    <div className="of-cover-photo"><OfferPhoto photo={vm.cover} label="Photo de couverture" overlayCaption /></div>
                </OfferPageShell>
            );
        }

        function OfferDetailPage({ vm, index, option: o }) {
            const kicker = `${OFFER_KINDS[o.kind].kicker} · ${pad2(o.n)} / ${pad2(o.count)} · Détails du séjour`;
            return (
                <OfferPageShell vm={vm} index={index} kicker={kicker} footer="standard">
                    <h1 className="of-h1">{o.title}</h1>
                    <p className="of-sub">{o.subtitle}</p>
                    {o.locationLine && <p className="of-loc">{o.locationLine}</p>}
                    <div className="of-pricebox">
                        <div className="of-pricebox-label">Tarif hébergement · {nightsLabel(vm.nights)}</div>
                        <div className={'of-pricebox-total' + (o.total === null ? ' of-ondemand' : '')}>{o.totalText}</div>
                        <div className="of-pricebox-rate">{o.rateText}</div>
                    </div>
                    <div className="of-flexphoto"><OfferPhoto photo={o.mainPhoto} label={o.title} /></div>
                    {o.infoItems.length > 0 && (
                        <div className="of-grid2">
                            {o.infoItems.map(([label, text]) => <div key={label}><div className="of-label">{label}</div><div className="of-text">{text}</div></div>)}
                        </div>
                    )}
                    {(o.highlight || o.remark) && (
                        <div className="of-note">
                            <div className="of-label">Pour vos vacances</div>
                            {o.highlight && <p>{o.highlight}</p>}
                            {o.remark && <p className="of-note-small">{o.remark}</p>}
                        </div>
                    )}
                    {o.gallery.length === 0 && o.websiteUrl && <p style={{ marginTop: '3mm' }}><a className="of-link" href={o.websiteUrl}>Voir le site de l’établissement</a></p>}
                </OfferPageShell>
            );
        }

        function OfferGalleryPage({ vm, index, option: o, photos, part, last }) {
            const kicker = `${OFFER_KINDS[o.kind].kicker} · ${pad2(o.n)} / ${pad2(o.count)} · Galerie photos${part > 0 ? ' (suite)' : ''}`;
            return (
                <OfferPageShell vm={vm} index={index} kicker={kicker} footer="standard">
                    <h1 className="of-h1">{o.title}</h1>
                    <p className="of-sub" style={{ marginBottom: '4mm' }}>{o.subtitle}</p>
                    {photos[0] && <OfferPhoto photo={photos[0]} label={o.title} height={photos.length === 1 ? '150mm' : '78mm'} />}
                    {photos.length > 1 && (
                        <div className="of-gallery-grid">
                            {photos.slice(1).map((p) => <OfferPhoto key={p.id} photo={p} label={o.title} height="50mm" />)}
                        </div>
                    )}
                    {last && o.galleryText && <p className="of-small" style={{ marginTop: '4mm', borderTop: '0.3mm solid var(--of-line)', paddingTop: '2.5mm' }}>{o.galleryText}</p>}
                    {last && o.websiteUrl && <p style={{ marginTop: '2.5mm' }}><a className="of-link" href={o.websiteUrl}>Voir le site et la galerie{o.commercialName ? ' de ' + o.commercialName : ''}</a></p>}
                </OfferPageShell>
            );
        }

        function OfferRecapTable({ vm }) {
            const locs = vm.options.filter((o) => offerGroup(o.kind) === 'location');
            const hotels = vm.options.filter((o) => offerGroup(o.kind) !== 'location');
            const row = (o) => (
                <tr key={o.uid}>
                    <td><span className="of-row-n">{pad2(o.n)}</span>{o.summaryLabel}</td>
                    <td className={'r' + (o.total === null ? ' of-ondemand' : '')}>{o.totalText}</td>
                </tr>
            );
            const currencyNote = vm.currency === 'MAD' ? 'Tarifs en dirhams marocains (DH)' : `Tarifs indicatifs en ${vm.currency === 'EUR' ? 'euros' : vm.currency}, convertis depuis nos tarifs en dirhams`;
            return (
                <>
                    <h1 className="of-h1">Le budget de votre séjour</h1>
                    <p className="of-loc">{nightsLabel(vm.nights)}{vm.dest ? ' ' + cityPrep(vm.dest) : ''} · {vm.travelers}</p>
                    <table className="of-table">
                        <thead><tr><th>Hébergement et formule · au choix</th><th className="r">Tarif pour {nightsLabel(vm.nights)}</th></tr></thead>
                        <tbody>
                            {locs.length > 0 && <tr className="of-group"><td colSpan="2">Locations courte durée</td></tr>}
                            {locs.map(row)}
                            {hotels.length > 0 && <tr className="of-group"><td colSpan="2">Hôtels et appart’hôtels</td></tr>}
                            {hotels.map(row)}
                            {vm.options.length === 0 && <tr><td colSpan="2" className="of-ondemand">Aucun hébergement sélectionné.</td></tr>}
                        </tbody>
                    </table>
                    <p className="of-small" style={{ marginTop: '2.5mm' }}>
                        Les hébergements sont proposés au choix : seul l’hébergement retenu sera réservé et facturé. {currencyNote}, sous réserve des conditions d’occupation applicables.
                    </p>
                    <p className="of-availability" style={{ marginTop: '1.5mm' }}>Offre sous réserve de disponibilité.</p>
                </>
            );
        }

        function OfferRecapDetails({ vm }) {
            const t = vm.so.transfer;
            const pct = String(vm.so.feePercent).replace('.', ',');
            const routeText = (t.route || '').trim();
            return (
                <>
                    {vm.so.showFeeNote && <div className="of-feebox">
                        <div className="of-label">Honoraires DI’ALLO Conciergerie</div>
                        <p>Les honoraires de conciergerie sont facturés séparément et correspondent à {pct} % du coût total des prestations retenues pour le voyage{t.enabled ? ', transfert compris si vous le réservez' : ''}.</p>
                    </div>}
                    {t.enabled && (
                        <div className="of-transfer">
                            {t.photo && t.photo.src && <div className="of-transfer-photo"><OfferPhoto photo={t.photo} label="Transfert" showCaption={false} /></div>}
                            <div style={{ flex: 1 }}>
                                <span className="of-optional">En option</span>
                                <h3 className="of-h3">Votre transfert privé</h3>
                                <div className="of-transfer-price">{t.price ? vm.money(t.price) : 'Sur demande'} · {TRIP_TYPES[t.tripType] || 'aller simple'}</div>
                                <p>{routeText}{routeText && !/[.!?]$/.test(routeText) ? '. ' : ' '}{t.description}</p>
                            </div>
                        </div>
                    )}
                    <h3 className="of-h3" style={{ marginTop: '5mm' }}>Pour confirmer votre réservation</h3>
                    <p className="of-text">{vm.so.confirmText}</p>
                    {vm.so.conditions.show && vm.so.conditions.items.some((i) => i.text && i.text.trim()) && (
                        <div style={{ marginTop: '4mm' }}>
                            <div className="of-label">Conditions</div>
                            <ul className="of-conditions">
                                {vm.so.conditions.items.filter((i) => i.text && i.text.trim()).map((i) => <li key={i.id}><RichLine text={i.text} /></li>)}
                            </ul>
                        </div>
                    )}
                </>
            );
        }

        function OfferRecapPage({ vm, index, part }) {
            return (
                <OfferPageShell vm={vm} index={index} kicker={part === 'details' ? 'Récapitulatif du séjour (suite)' : 'Récapitulatif du séjour'} footer="standard">
                    {part !== 'details' && <OfferRecapTable vm={vm} />}
                    {part === 'details' && <h1 className="of-h1">Honoraires, transfert et réservation</h1>}
                    {part !== 'table' && <OfferRecapDetails vm={vm} />}
                </OfferPageShell>
            );
        }

        function OfferClosingPage({ vm, index }) {
            const c = vm.closing;
            return (
                <OfferPageShell vm={vm} index={index} footer="closing">
                    <OfferPhoto photo={c} label="Photo de fin" height="140mm" showCaption={false} />
                    {c && (c.caption || c.credit) && <p className="of-caption" style={{ textAlign: 'right' }}>{[c.caption, c.credit].filter(Boolean).join(' · ')}</p>}
                    <div style={{ display: 'flex', justifyContent: 'center', marginTop: '12mm' }}><OfferLogo logoUrl={vm.logoUrl} height="22mm" /></div>
                    <div className="of-gold-rule"></div>
                    <p className="of-slogan">Profitez de votre séjour,<br /><em>on s’occupe du reste.</em></p>
                </OfferPageShell>
            );
        }

        function StayOfferPages({ vm }) {
            return (
                <>
                    {vm.pages.map((p, i) => {
                        if (p.type === 'cover') return <OfferCoverPage key={i} vm={vm} index={i} />;
                        if (p.type === 'detail') return <OfferDetailPage key={i} vm={vm} index={i} option={p.option} />;
                        if (p.type === 'gallery') return <OfferGalleryPage key={i} vm={vm} index={i} option={p.option} photos={p.photos} part={p.part} last={p.last} />;
                        if (p.type === 'recap') return <OfferRecapPage key={i} vm={vm} index={i} part={p.part} />;
                        return <OfferClosingPage key={i} vm={vm} index={i} />;
                    })}
                </>
            );
        }

        // ---------- Aperçu et export PDF ----------
        function StayOfferPreviewModal({ vm, fileName, warnings, onClose }) {
            const portalEl = useMemo(() => {
                let el = document.getElementById('offer-print-portal');
                if (!el) { el = document.createElement('div'); el.id = 'offer-print-portal'; document.body.appendChild(el); }
                return el;
            }, []);
            const previewRef = useRef(null);
            const [zoom, setZoom] = useState(() => Math.max(0.35, Math.min(1, (window.innerWidth - 48) / 820)));
            const [overflowPages, setOverflowPages] = useState([]);
            const [exportState, setExportState] = useState(null);

            // Détecte les pages dont le contenu dépasse (texte trop long) pour éviter un PDF tronqué.
            useEffect(() => {
                const check = () => {
                    if (!previewRef.current) return;
                    const found = [];
                    previewRef.current.querySelectorAll('.offer-page').forEach((page) => {
                        const c = page.querySelector('.of-content');
                        const over = c && c.scrollHeight > c.clientHeight + 2;
                        page.setAttribute('data-overflow', over ? '1' : '0');
                        if (over) found.push(page.getAttribute('data-page'));
                    });
                    setOverflowPages((prev) => (prev.join(',') === found.join(',') ? prev : found));
                };
                check();
                const t = setInterval(check, 800);
                return () => clearInterval(t);
            }, [vm]);

            const doPrint = () => {
                const prevTitle = document.title;
                let done = false;
                const cleanup = () => {
                    if (done) return;
                    done = true;
                    document.body.classList.remove('printing-offer');
                    document.title = prevTitle;
                    window.removeEventListener('afterprint', cleanup);
                };
                document.body.classList.add('printing-offer');
                document.title = fileName;
                window.addEventListener('afterprint', cleanup);
                setTimeout(() => {
                    window.print();
                    // Filet de sécurité pour les navigateurs qui n'émettent pas « afterprint ».
                    setTimeout(() => { window.addEventListener('mousedown', cleanup, { once: true }); window.addEventListener('keydown', cleanup, { once: true }); }, 1000);
                }, 50);
            };

            const startExport = async () => {
                setExportState({ phase: 'loading' });
                const res = await waitForOfferImages(portalEl, 20000);
                if (res.broken.length || res.pending.length) { setExportState({ phase: 'issues', ...res }); return; }
                setExportState(null);
                doPrint();
            };

            return (
                <div className="fixed inset-0 z-[70] bg-slate-900/90 flex flex-col no-print">
                    <div className="bg-slate-900 text-white px-4 py-3 flex flex-wrap items-center gap-3 border-b border-slate-700 shrink-0">
                        <div className="flex items-center gap-2 mr-auto">
                            <i className="ph ph-file-pdf text-2xl text-amber-500"></i>
                            <div>
                                <p className="font-black leading-tight">Aperçu de l’offre — {vm.totalPages} pages A4</p>
                                <p className="text-xs text-slate-400">{fileName}.pdf</p>
                            </div>
                        </div>
                        <label className="flex items-center gap-2 text-xs text-slate-300">Zoom
                            <input type="range" min="0.3" max="1.2" step="0.05" value={zoom} onChange={(e) => setZoom(parseFloat(e.target.value))} className="accent-amber-500" />
                        </label>
                        <button onClick={startExport} disabled={exportState && exportState.phase === 'loading'} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-lg flex items-center gap-2 disabled:opacity-60">
                            {exportState && exportState.phase === 'loading' ? <><i className="ph ph-spinner animate-spin"></i> Chargement des photos…</> : <><i className="ph ph-download-simple"></i> Exporter en PDF</>}
                        </button>
                        <button onClick={onClose} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg font-medium">Fermer</button>
                    </div>

                    {(overflowPages.length > 0 || warnings.length > 0) && (
                        <div className="bg-amber-50 text-amber-900 text-xs px-4 py-2 border-b border-amber-200 max-h-28 overflow-y-auto shrink-0">
                            {overflowPages.length > 0 && <p className="font-bold text-red-700"><i className="ph ph-warning"></i> Texte trop long : la fin du contenu est coupée page {overflowPages.join(', ')} (encadré rouge). Raccourcissez les descriptions concernées.</p>}
                            {warnings.map((w, i) => <p key={i}><i className="ph ph-info"></i> {w}</p>)}
                        </div>
                    )}

                    {exportState && exportState.phase === 'issues' && (
                        <div className="bg-red-50 border-b border-red-200 px-4 py-3 text-sm text-red-800 shrink-0">
                            <p className="font-black mb-1"><i className="ph ph-image-broken"></i> Certaines images ne peuvent pas être chargées :</p>
                            <ul className="list-disc pl-6 text-xs space-y-0.5 max-h-24 overflow-y-auto">
                                {exportState.broken.map((l) => <li key={'b' + l}>{l} — <strong>image indisponible</strong> (lien invalide, site qui bloque l’affichage ou fichier supprimé)</li>)}
                                {exportState.pending.map((l) => <li key={'p' + l}>{l} — <strong>chargement trop long</strong></li>)}
                            </ul>
                            <p className="text-xs mt-1">Elles apparaîtront comme « Image indisponible » dans le PDF. Remplacez-les (de préférence par une photo importée) ou exportez quand même.</p>
                            <div className="flex gap-2 mt-2">
                                <button onClick={() => { setExportState(null); doPrint(); }} className="px-3 py-1.5 bg-red-600 text-white rounded-lg font-bold text-xs">Exporter quand même</button>
                                <button onClick={() => setExportState(null)} className="px-3 py-1.5 bg-white border border-red-300 rounded-lg font-bold text-xs">Corriger d’abord</button>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 overflow-auto py-6 px-2 bg-slate-700/60">
                        <p className="text-center text-slate-300 text-xs mb-4">Dans la fenêtre d’impression, choisissez « Enregistrer au format PDF », format A4, marges « Aucune », et activez « Graphiques d’arrière-plan ».</p>
                        <div ref={previewRef} className="of-preview" style={{ zoom }}>
                            <StayOfferPages vm={vm} />
                        </div>
                    </div>
                    {ReactDOM.createPortal(<StayOfferPages vm={vm} />, portalEl)}
                </div>
            );
        }

        // ---------- Formulaires photos ----------
        const ofInput = 'w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-amber-500 focus:bg-white';

        function OfField({ label, hint, children, className }) {
            return (
                <div className={className}>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">{label}</label>
                    {children}
                    {hint && <p className="text-[10px] text-slate-400 mt-0.5 leading-tight">{hint}</p>}
                </div>
            );
        }

        function AddPhotoForm({ onAdd, buttonLabel }) {
            const [open, setOpen] = useState(false);
            const [url, setUrl] = useState('');
            const [caption, setCaption] = useState('');
            const [illustrative, setIllustrative] = useState(false);
            const [validated, setValidated] = useState(false);
            const [authorized, setAuthorized] = useState(false);
            const [busy, setBusy] = useState(false);
            const [msg, setMsg] = useState('');
            const reset = () => { setUrl(''); setCaption(''); setIllustrative(false); setValidated(false); setAuthorized(false); };
            const add = (src) => {
                onAdd(normalizePhoto({ id: offerUid(), src, caption: caption.trim(), illustrative, captionValidated: validated && !!caption.trim(), authorized: true }));
                reset();
                setOpen(false);
            };
            const addUrl = () => {
                const u = url.trim();
                if (!/^(https?:|data:image\/)/i.test(u)) { setMsg('Collez un lien complet commençant par https://'); return; }
                if (!authorized) { setMsg('Cochez « Photo autorisée » pour confirmer les droits de diffusion.'); return; }
                setMsg('');
                add(u);
            };
            const onFile = async (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                if (!authorized) { setMsg('Cochez « Photo autorisée » avant d’importer le fichier.'); return; }
                setBusy(true); setMsg('');
                try {
                    const dataUrl = await compressImageFile(f);
                    const res = await PhotoStore.put(dataUrl);
                    add(res.ref);
                    if (!res.cloud) setMsg('Photo enregistrée sur cet appareil uniquement (cloud indisponible). Pour la retrouver sur vos autres appareils, utilisez plutôt un lien.');
                } catch (err) { setMsg('Import impossible : ' + err.message); }
                finally { setBusy(false); }
            };
            if (!open) {
                return (
                    <div className="mt-2">
                        <button type="button" onClick={() => { setOpen(true); setMsg(''); }} className="text-xs font-bold text-amber-700 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-lg hover:bg-amber-100"><i className="ph ph-plus"></i> {buttonLabel || 'Ajouter une photo'}</button>
                        {msg && <p className="text-[11px] text-amber-700 mt-1">{msg}</p>}
                    </div>
                );
            }
            return (
                <div className="mt-2 p-3 bg-amber-50/60 border border-amber-200 rounded-xl space-y-2">
                    <div className="flex gap-2">
                        <input type="url" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="Lien de la photo (https://…)" className={ofInput} />
                        <button type="button" onClick={addUrl} className="px-3 bg-slate-900 text-white rounded-lg text-xs font-bold shrink-0">Ajouter le lien</button>
                    </div>
                    <input type="text" value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="Légende (ex. Séjour, Chambre, Façade de l’hôtel)" className={ofInput} />
                    <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-700">
                        <label className="flex items-center gap-1"><input type="checkbox" checked={validated} onChange={(e) => setValidated(e.target.checked)} className="accent-amber-500" /> Légende validée</label>
                        <label className="flex items-center gap-1"><input type="checkbox" checked={illustrative} onChange={(e) => setIllustrative(e.target.checked)} className="accent-amber-500" /> Visuel illustratif (autre logement)</label>
                        <label className="flex items-center gap-1 font-bold"><input type="checkbox" checked={authorized} onChange={(e) => setAuthorized(e.target.checked)} className="accent-amber-500" /> Photo autorisée à la diffusion</label>
                    </div>
                    <div className="flex items-center gap-2">
                        <label className={`cursor-pointer text-xs font-bold px-3 py-1.5 rounded-lg ${busy ? 'bg-slate-200 text-slate-500' : 'bg-white border border-slate-300 hover:bg-slate-100'}`}>
                            <i className="ph ph-upload-simple"></i> {busy ? 'Import…' : 'Importer un fichier'}
                            <input type="file" accept="image/*" className="hidden" onChange={onFile} disabled={busy} />
                        </label>
                        <button type="button" onClick={() => { setOpen(false); reset(); setMsg(''); }} className="text-xs text-slate-500 ml-auto">Annuler</button>
                    </div>
                    {msg && <p className="text-[11px] text-red-600">{msg}</p>}
                </div>
            );
        }

        function PhotoListEditor({ photos, onChange, label }) {
            const list = photos || [];
            const patch = (i, p) => onChange(list.map((ph, k) => (k === i ? { ...ph, ...p } : ph)));
            const move = (i, d) => { const j = i + d; if (j < 0 || j >= list.length) return; const next = [...list]; [next[i], next[j]] = [next[j], next[i]]; onChange(next); };
            const setMain = (i) => { const next = [...list]; const [p] = next.splice(i, 1); onChange([p, ...next]); };
            const remove = (i) => onChange(list.filter((_, k) => k !== i));
            return (
                <div>
                    {list.length === 0 && <p className="text-xs text-slate-400 italic">Aucune photo pour cet hébergement.</p>}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        {list.map((ph, i) => (
                            <div key={ph.id} className={`rounded-xl p-2 bg-white border ${i === 0 ? 'border-amber-400 ring-2 ring-amber-100' : 'border-slate-200'}`}>
                                <div className="relative h-28 rounded-lg overflow-hidden bg-slate-100 of-thumb">
                                    <OfferImg src={ph.src} label={`${label}${ph.caption ? ' – ' + ph.caption : ''}`} />
                                    {i === 0 && <span className="absolute top-1 left-1 bg-amber-500 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded">PRINCIPALE</span>}
                                    {ph.illustrative && <span className="absolute bottom-1 left-1 bg-slate-900/80 text-white text-[10px] px-2 py-0.5 rounded">Visuel illustratif</span>}
                                </div>
                                <input type="text" value={ph.caption} onChange={(e) => patch(i, { caption: e.target.value, captionValidated: false })} placeholder="Légende" className="w-full mt-2 p-1.5 border border-slate-200 rounded text-xs" />
                                <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-1 text-[11px] text-slate-600">
                                    <label className="flex items-center gap-1"><input type="checkbox" checked={ph.captionValidated} onChange={(e) => patch(i, { captionValidated: e.target.checked })} className="accent-amber-500" /> Légende validée</label>
                                    <label className="flex items-center gap-1"><input type="checkbox" checked={ph.illustrative} onChange={(e) => patch(i, { illustrative: e.target.checked })} className="accent-amber-500" /> Illustratif</label>
                                    <label className="flex items-center gap-1"><input type="checkbox" checked={ph.authorized} onChange={(e) => patch(i, { authorized: e.target.checked })} className="accent-amber-500" /> Autorisée</label>
                                </div>
                                <div className="flex gap-1 mt-1.5 justify-end text-slate-500">
                                    {i !== 0 && <button type="button" title="Photo principale" onClick={() => setMain(i)} className="px-1.5 hover:text-amber-600"><i className="ph ph-star"></i></button>}
                                    <button type="button" title="Avancer" onClick={() => move(i, -1)} disabled={i === 0} className="px-1.5 hover:text-slate-900 disabled:opacity-30"><i className="ph ph-arrow-left"></i></button>
                                    <button type="button" title="Reculer" onClick={() => move(i, 1)} disabled={i === list.length - 1} className="px-1.5 hover:text-slate-900 disabled:opacity-30"><i className="ph ph-arrow-right"></i></button>
                                    <button type="button" title="Retirer" onClick={() => remove(i)} className="px-1.5 text-red-400 hover:text-red-600"><i className="ph ph-trash"></i></button>
                                </div>
                            </div>
                        ))}
                    </div>
                    <AddPhotoForm onAdd={(p) => onChange([...list, p])} />
                </div>
            );
        }

        function SinglePhotoField({ photo, onChange, label, withCredit }) {
            if (!photo) return <AddPhotoForm onAdd={onChange} buttonLabel={`Choisir ${label.toLowerCase()}`} />;
            return (
                <div className="flex gap-3 items-start">
                    <div className="relative w-36 h-24 rounded-lg overflow-hidden bg-slate-100 of-thumb shrink-0"><OfferImg src={photo.src} label={label} /></div>
                    <div className="flex-1 space-y-1.5">
                        <input type="text" value={photo.caption} onChange={(e) => onChange({ ...photo, caption: e.target.value, captionValidated: false })} placeholder="Légende (ex. Mosquée Hassan II, Casablanca)" className={ofInput} />
                        {withCredit && <input type="text" value={photo.credit || ''} onChange={(e) => onChange({ ...photo, credit: e.target.value })} placeholder="Crédit photo (ex. Photo de …)" className={ofInput} />}
                        <div className="flex flex-wrap gap-x-3 text-[11px] text-slate-600 items-center">
                            <label className="flex items-center gap-1"><input type="checkbox" checked={photo.captionValidated} onChange={(e) => onChange({ ...photo, captionValidated: e.target.checked })} className="accent-amber-500" /> Légende validée</label>
                            <label className="flex items-center gap-1"><input type="checkbox" checked={photo.authorized} onChange={(e) => onChange({ ...photo, authorized: e.target.checked })} className="accent-amber-500" /> Autorisée</label>
                            <button type="button" onClick={() => onChange(null)} className="ml-auto text-red-500 font-bold"><i className="ph ph-trash"></i> Retirer</button>
                        </div>
                    </div>
                </div>
            );
        }

        function CatalogAccomPicker({ catalog, destination, onAdd, onClose, existingCatalogIds }) {
            const [showAll, setShowAll] = useState(!destination);
            const [selected, setSelected] = useState([]);
            const [search, setSearch] = useState('');
            const all = catalog.accommodations || [];
            const list = all
                .filter((a) => showAll || sameCity(a.city, destination))
                .filter((a) => !search || cityKey([a.name, a.commercialName, a.neighborhood, a.city, a.type].join(' ')).includes(cityKey(search)));
            const toggle = (id) => setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
            return (
                <div className="fixed inset-0 bg-slate-900/60 z-[65] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
                        <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                            <h3 className="font-bold"><i className="ph ph-buildings text-amber-500"></i> Hébergements du catalogue {!showAll && destination ? `· ${destination}` : ''}</h3>
                            <button onClick={onClose}><i className="ph ph-x text-xl"></i></button>
                        </div>
                        <div className="p-3 border-b flex flex-wrap gap-3 items-center">
                            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Rechercher (nom, quartier, type…)" className={ofInput + ' flex-1 min-w-[180px]'} />
                            <label className="text-xs flex items-center gap-1"><input type="checkbox" checked={showAll} onChange={(e) => setShowAll(e.target.checked)} className="accent-amber-500" /> Toutes les villes</label>
                        </div>
                        <div className="flex-1 overflow-y-auto divide-y">
                            {list.length === 0 && <p className="p-6 text-center text-sm text-slate-500">Aucun hébergement {showAll ? '' : `pour « ${destination} »`} dans le catalogue. Cochez « Toutes les villes » ou ajoutez un hébergement hors catalogue.</p>}
                            {list.map((a) => {
                                const kind = OFFER_KINDS[a.category] ? a.category : kindFromType(a.type);
                                const photos = (a.photos || []).length;
                                return (
